<!-- updated 2026-08-25 — added Classroomscreen-style widgets -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Infinite Whiteboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100%;
            width: 100%;
            overscroll-behavior: none;
            font-family: 'Segoe UI', system-ui, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        #canvas-container {
            position: absolute;
            inset: 0;
            background-color: #f8fafc;
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 40px 40px;
            touch-action: none;
        }

        canvas {
            position: absolute;
            inset: 0;
            display: block;
            touch-action: none;
            -webkit-touch-callout: none;
        }

        #mainCanvas {
            z-index: 10;
        }

        #overlayCanvas {
            z-index: 20;
            cursor: crosshair;
        }

        .tool-btn.active {
            background-color: #2563eb;
            color: white;
            box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2);
        }

        .color-btn.active {
            transform: scale(1.25);
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px white, 0 0 0 4px #3b82f6;
        }

        /* ─── MOBILE / TABLET ───────────────────────────────────────────── */
        body { touch-action: none; }
        html { height: 100dvh; }
        button { -webkit-tap-highlight-color: transparent; }

        #toolbar {
            max-width: calc(100vw - 16px);
            overflow-x: auto;
            overflow-y: hidden;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
            bottom: calc(1.5rem + env(safe-area-inset-bottom));
        }
        #toolbar::-webkit-scrollbar { display: none; }
        #toolbar > * { flex-shrink: 0; }

        #rail-toggle { display: none; }

        /* Touch devices: bigger targets, no hover tooltips */
        @media (pointer: coarse) {
            #toolbar button, #zoom-controls button { padding: 12px; }
            .color-btn { width: 26px; height: 26px; padding: 0; }
            #thickness-slider { height: 6px; }
            #widget-rail button::after { display: none; }
            .widget-head button { width: 34px; height: 34px; }
            .widget-resize { width: 34px; height: 34px; }
            .wbtn { padding: 9px 14px; }
        }

        /* Phones and small tablets: collapse the widget rail behind a button, move zoom to the top */
        @media (max-width: 820px) {
            #status-pill { top: calc(0.5rem + env(safe-area-inset-top)); right: 0.5rem; padding: 6px 10px; }
            #status-text { font-size: 12px; }
            #zoom-controls {
                top: calc(3.5rem + env(safe-area-inset-top)); right: 0.5rem; bottom: auto;
                flex-direction: row; padding: 4px;
            }
            #zoom-controls > div { width: 1px; height: 24px; margin: 0 2px; }
            #zoom-controls button { padding: 8px; }
            #btn-zoom-reset { width: 40px; height: 36px; }
            #rail-toggle {
                display: flex; position: fixed; z-index: 51;
                top: calc(0.5rem + env(safe-area-inset-top)); left: calc(0.5rem + env(safe-area-inset-left));
                align-items: center; gap: 6px; padding: 8px 12px;
                background: rgba(255,255,255,.95); backdrop-filter: blur(10px);
                border: 1px solid rgba(0,0,0,.06); border-radius: 12px;
                box-shadow: 0 8px 30px rgba(0,0,0,.12);
                font-size: 13px; font-weight: 600; color: #475569;
            }
            #rail-toggle svg { width: 18px; height: 18px; }
            #widget-rail {
                display: none; top: calc(3.5rem + env(safe-area-inset-top)); left: calc(0.5rem + env(safe-area-inset-left));
                transform: none; flex-direction: row; flex-wrap: wrap; max-width: calc(100vw - 16px);
            }
            #widget-rail.open { display: flex; }
            #widget-rail .rail-sep { width: 1px; height: 28px; margin: 6px 2px; }
            .widget { max-width: calc(100vw - 16px); max-height: calc(100dvh - 110px); }
            #eraser-options { bottom: calc(5.5rem + env(safe-area-inset-bottom)); }
        }

        /* ─── E-INK MODE (Boox etc.): no blur, shadows, transitions or grid → fewer repaints ── */
        body.eink #canvas-container { background-image: none !important; background-color: #fff; }
        body.eink #toolbar, body.eink #zoom-controls, body.eink #status-pill, body.eink #eraser-options,
        body.eink #widget-rail, body.eink #rail-toggle, body.eink .widget {
            backdrop-filter: none !important; -webkit-backdrop-filter: none !important;
            box-shadow: none !important; background: #fff !important; border: 2px solid #000 !important;
        }
        body.eink * { transition: none !important; animation-duration: 0s !important; }
        body.eink .tool-btn.active, body.eink #btn-grid.text-blue-600, body.eink #btn-touch.text-blue-600, body.eink #btn-eink {
            background: #000 !important; color: #fff !important;
        }
        body.eink .color-btn.active { box-shadow: 0 0 0 2px #fff, 0 0 0 4px #000; }
        body.eink #fireworks-canvas { display: none; }

        /* Eraser cursor */
        .cursor-eraser {
            cursor: cell;
        }

        /* ─── WIDGETS ─────────────────────────────────────────────────────────── */
        #widget-layer {
            position: absolute;
            inset: 0;
            z-index: 30;
            pointer-events: none;
            overflow: hidden;
        }

        .widget {
            position: absolute;
            pointer-events: auto;
            background: rgba(255, 255, 255, 0.97);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
            display: flex;
            flex-direction: column;
            min-width: 180px;
            min-height: 120px;
            overflow: hidden;
            user-select: none;
        }

        .widget.focused {
            box-shadow: 0 0 0 2px #2563eb, 0 12px 36px rgba(0, 0, 0, 0.18);
        }

        .widget-head {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 8px 6px 12px;
            font-size: 12px;
            font-weight: 600;
            color: #64748b;
            letter-spacing: .02em;
            text-transform: uppercase;
            cursor: grab;
            border-bottom: 1px solid #f1f5f9;
            touch-action: none;
        }

        .widget-head:active { cursor: grabbing; }
        .widget-head .spacer { flex: 1; }

        .widget-head button {
            width: 26px; height: 26px;
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            color: #94a3b8;
        }
        .widget-head button:hover { background: #f1f5f9; color: #334155; }
        .widget-head button.close:hover { background: #fee2e2; color: #ef4444; }
        .widget-head button svg { width: 15px; height: 15px; }

        .widget-body {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            padding: 12px;
            overflow: auto;
        }

        .widget-resize {
            position: absolute;
            right: 0; bottom: 0;
            width: 22px; height: 22px;
            cursor: nwse-resize;
            touch-action: none;
        }
        .widget-resize::after {
            content: '';
            position: absolute;
            right: 6px; bottom: 6px;
            width: 8px; height: 8px;
            border-right: 2px solid #cbd5e1;
            border-bottom: 2px solid #cbd5e1;
            border-radius: 0 0 3px 0;
        }

        /* Big numeric readouts (clock, timer, stopwatch) scale with widget width */
        .readout {
            font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
            font-variant-numeric: tabular-nums;
            font-weight: 700;
            color: #0f172a;
            line-height: 1;
            text-align: center;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: var(--readout, 48px);
        }

        .wbtn {
            padding: 6px 12px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            background: #f1f5f9;
            color: #334155;
            transition: background .15s;
        }
        .wbtn:hover { background: #e2e8f0; }
        .wbtn.primary { background: #2563eb; color: white; }
        .wbtn.primary:hover { background: #1d4ed8; }
        .wbtn.danger { background: #fee2e2; color: #b91c1c; }
        .wbtn.small { padding: 4px 8px; font-size: 12px; }

        .widget textarea, .widget input[type="text"], .widget input[type="number"] {
            font: inherit;
            color: #0f172a;
            background: transparent;
            outline: none;
            user-select: text;
            -webkit-user-select: text;
        }

        /* Widget rail */
        #widget-rail {
            position: fixed;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 50;
            display: flex;
            flex-direction: column;
            gap: 2px;
            padding: 6px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 0, 0, 0.06);
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
        }
        #widget-rail button {
            position: relative;
            width: 40px; height: 40px;
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            color: #475569;
            transition: all .15s;
        }
        #widget-rail button:hover { background: #eff6ff; color: #2563eb; }
        #widget-rail button svg { width: 20px; height: 20px; }
        #widget-rail button::after {
            content: attr(data-label);
            position: absolute;
            left: 48px;
            background: #0f172a;
            color: white;
            font-size: 12px;
            font-weight: 500;
            padding: 4px 8px;
            border-radius: 6px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity .12s;
        }
        #widget-rail button:hover::after { opacity: 1; }
        #widget-rail .rail-sep { height: 1px; background: #e2e8f0; margin: 4px 6px; }

        /* Traffic light */
        .tl-lamp {
            border-radius: 9999px;
            aspect-ratio: 1;
            width: 100%;
            max-width: 90px;
            margin: 0 auto;
            opacity: .18;
            cursor: pointer;
            transition: opacity .2s, box-shadow .2s;
        }
        .tl-lamp.on { opacity: 1; box-shadow: 0 0 24px currentColor; }

        /* Dice */
        .die {
            width: 64px; height: 64px;
            background: white;
            border: 2px solid #0f172a;
            border-radius: 12px;
            display: grid;
            grid-template: repeat(3, 1fr) / repeat(3, 1fr);
            padding: 8px;
            gap: 2px;
        }
        .die span { border-radius: 50%; background: #0f172a; visibility: hidden; }
        .die span.on { visibility: visible; }
        .die.rolling { animation: shake .4s ease-in-out; }
        @keyframes shake {
            0%, 100% { transform: rotate(0); }
            25% { transform: rotate(-14deg) translateY(-4px); }
            75% { transform: rotate(14deg) translateY(-4px); }
        }

        /* Noise meter */
        .noise-bar { height: 100%; width: 100%; transition: transform .08s linear; transform-origin: bottom; }

        /* Work symbols */
        .sym-btn {
            border-radius: 12px;
            padding: 8px 4px;
            display: flex; flex-direction: column; align-items: center; gap: 4px;
            font-size: 11px; font-weight: 600; color: #64748b;
        }
        .sym-btn.on { background: #dbeafe; color: #1d4ed8; }
        .sym-btn svg { width: 22px; height: 22px; }

        /* Cat */
        @keyframes cat-tail { 0%,100% { transform: rotate(0); } 50% { transform: rotate(-14deg); } }
        @keyframes cat-legs { 0%,100% { transform: rotate(-12deg); } 50% { transform: rotate(12deg); } }
        @keyframes cat-breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.04); } }
        .cat-tail { transform-origin: 28px 40px; animation: cat-tail .8s ease-in-out infinite; }
        .cat-leg { transform-origin: 50% 0; animation: cat-legs .35s ease-in-out infinite; }
        .cat-leg:nth-of-type(2n) { animation-delay: .17s; }
        .cat-sleep .cat-tail, .cat-sleep .cat-leg { animation: none; }
        .cat-sleep svg { animation: cat-breathe 2.4s ease-in-out infinite; }

        #fireworks-canvas { position: fixed; inset: 0; pointer-events: none; z-index: 40; }

        @media (prefers-reduced-motion: reduce) {
            .die.rolling, .cat-tail, .cat-leg, .cat-sleep svg { animation: none; }
        }
    </style>
</head>

<body>
    <div id="canvas-container">
        <canvas id="mainCanvas"></canvas>
        <canvas id="overlayCanvas"></canvas>
    </div>

    <!-- Status -->
    <div id="status-pill"
        class="fixed top-4 right-4 bg-white/90 backdrop-blur-md rounded-xl shadow border border-gray-200 px-4 py-2 flex items-center gap-2 z-50">
        <div id="status-dot" class="w-2.5 h-2.5 rounded-full bg-gray-400"></div>
        <span id="status-text" class="text-sm font-medium text-gray-700">Connecting...</span>
    </div>

    <!-- Eraser Options -->
    <div id="eraser-options"
        class="hidden fixed bottom-24 left-1/2 transform -translate-x-1/2 bg-white/95 backdrop-blur-md rounded-xl shadow-lg border border-gray-200/50 p-1.5 flex gap-1 z-50">
        <button id="btn-erase-stroke"
            class="px-4 py-1.5 text-sm rounded-lg bg-blue-100 text-blue-700 font-bold transition">Stroke Erase</button>
        <button id="btn-erase-partial"
            class="px-4 py-1.5 text-sm rounded-lg hover:bg-gray-100 text-gray-600 font-medium transition">Partial
            Erase</button>
    </div>

    <!-- Toolbar -->
    <div id="toolbar"
        class="fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-white/95 backdrop-blur-md rounded-2xl shadow-[0_8px_30px_rgb(0,0,0,0.12)] border border-gray-200/50 p-1.5 flex items-center gap-1 z-50">
        <button id="btn-pen" class="tool-btn active text-gray-600 p-2 rounded-lg transition-all duration-200"
            title="Pen"><i data-lucide="pen" class="w-5 h-5"></i></button>
        <button id="btn-eraser"
            class="tool-btn text-gray-600 p-2 rounded-lg hover:bg-gray-100 transition-all duration-200"
            title="Eraser"><i data-lucide="eraser" class="w-5 h-5"></i></button>
        <div class="w-[1px] h-6 bg-gray-200 mx-1"></div>
        <button id="btn-arrow"
            class="tool-btn text-gray-600 p-2 rounded-lg hover:bg-gray-100 transition-all duration-200" title="Arrow"><i
                data-lucide="arrow-up-right" class="w-5 h-5"></i></button>
        <button id="btn-rect"
            class="tool-btn text-gray-600 p-2 rounded-lg hover:bg-gray-100 transition-all duration-200"
            title="Rectangle"><i data-lucide="square" class="w-5 h-5"></i></button>
        <button id="btn-circle"
            class="tool-btn text-gray-600 p-2 rounded-lg hover:bg-gray-100 transition-all duration-200"
            title="Circle"><i data-lucide="circle" class="w-5 h-5"></i></button>
        <div class="w-[1px] h-6 bg-gray-200 mx-1"></div>
        <button id="btn-pan" class="tool-btn text-gray-600 p-2 rounded-lg hover:bg-gray-100 transition-all duration-200"
            title="Pan"><i data-lucide="hand" class="w-5 h-5"></i></button>
        <button id="btn-touch"
            class="text-gray-600 p-2 rounded-lg hover:bg-gray-100 transition-all duration-200"
            title="Finger: draw / pan (pen always draws)"><i data-lucide="pointer" class="w-5 h-5"></i></button>
        <button id="btn-eink"
            class="text-gray-600 p-2 rounded-lg hover:bg-gray-100 transition-all duration-200"
            title="E-ink mode (Boox, reMarkable): fewer repaints, less lag"><i data-lucide="book-open" class="w-5 h-5"></i></button>
        <button id="btn-grid"
            class="text-blue-600 bg-blue-50 p-2 rounded-lg hover:bg-gray-100 transition-all duration-200"
            title="Toggle Grid"><i data-lucide="grid-3x3" class="w-5 h-5"></i></button>
        <div class="w-[1px] h-6 bg-gray-200 mx-1"></div>

        <!-- Colors -->
        <div class="flex gap-1 px-1 items-center">
            <button class="color-btn active w-5 h-5 rounded-full bg-black transition-all duration-200"
                data-color="#000000"></button>
            <button
                class="color-btn w-5 h-5 rounded-full bg-gray-500 border border-black/10 transition-all duration-200"
                data-color="#6b7280"></button>
            <button class="color-btn w-5 h-5 rounded-full bg-red-500 border border-black/10 transition-all duration-200"
                data-color="#ef4444"></button>
            <button
                class="color-btn w-5 h-5 rounded-full bg-orange-500 border border-black/10 transition-all duration-200"
                data-color="#f97316"></button>
            <button
                class="color-btn w-5 h-5 rounded-full bg-yellow-400 border border-black/10 transition-all duration-200"
                data-color="#eab308"></button>
            <button
                class="color-btn w-5 h-5 rounded-full bg-green-500 border border-black/10 transition-all duration-200"
                data-color="#22c55e"></button>
            <button
                class="color-btn w-5 h-5 rounded-full bg-blue-500 border border-black/10 transition-all duration-200"
                data-color="#3b82f6"></button>
            <button
                class="color-btn w-5 h-5 rounded-full bg-purple-500 border border-black/10 transition-all duration-200"
                data-color="#a855f7"></button>
        </div>
        <div class="w-[1px] h-6 bg-gray-200 mx-1"></div>

        <div class="px-1 flex items-center gap-1.5">
            <i data-lucide="scaling" class="w-4 h-4 text-gray-400"></i>
            <input type="range" id="thickness-slider" min="1" max="30" value="3"
                class="w-20 accent-blue-600 h-1 bg-gray-200 rounded-lg appearance-none cursor-pointer">
        </div>
        <div class="w-[1px] h-6 bg-gray-200 mx-1"></div>

        <!-- Undo -->
        <button id="btn-undo"
            class="p-2 rounded-lg hover:bg-gray-100 text-gray-400 hover:text-gray-700 transition-all duration-200"
            title="Undo (Ctrl+Z)">
            <i data-lucide="undo-2" class="w-5 h-5"></i>
        </button>
        <!-- Clear -->
        <button id="btn-clear"
            class="p-2 rounded-lg hover:bg-red-50 text-gray-400 hover:text-red-500 transition-all duration-200"
            title="Clear Board">
            <i data-lucide="trash-2" class="w-5 h-5"></i>
        </button>
    </div>

    <!-- Zoom Controls -->
    <div id="zoom-controls"
        class="fixed bottom-6 right-6 bg-white/95 backdrop-blur-md rounded-2xl shadow-[0_8px_30px_rgb(0,0,0,0.12)] border border-gray-200/50 p-1.5 flex flex-col items-center gap-1 z-50">
        <button id="btn-zoom-in" class="text-gray-600 p-2.5 rounded-xl hover:bg-gray-100 transition-all"><i
                data-lucide="plus" class="w-5 h-5"></i></button>
        <div class="w-8 h-[1px] bg-gray-200 my-0.5"></div>
        <button id="btn-zoom-reset"
            class="w-10 h-10 flex items-center justify-center text-[11px] font-bold text-gray-600 rounded-xl hover:bg-gray-100 transition-all">100%</button>
        <div class="w-8 h-[1px] bg-gray-200 my-0.5"></div>
        <button id="btn-zoom-out" class="text-gray-600 p-2.5 rounded-xl hover:bg-gray-100 transition-all"><i
                data-lucide="minus" class="w-5 h-5"></i></button>
    </div>


    <canvas id="fireworks-canvas"></canvas>

    <!-- Widget layer (floating tools sit above the canvas, screen-fixed like Classroomscreen) -->
    <div id="widget-layer"></div>

    <!-- Widget rail -->
    <button id="rail-toggle"><i data-lucide="layout-grid"></i>Widgets</button>
    <div id="widget-rail">
        <button data-widget="clock" data-label="Clock"><i data-lucide="clock"></i></button>
        <button data-widget="timer" data-label="Timer"><i data-lucide="timer"></i></button>
        <button data-widget="stopwatch" data-label="Stopwatch"><i data-lucide="watch"></i></button>
        <button data-widget="schedule" data-label="Period timer / bell schedule"><i data-lucide="bell"></i></button>
        <button data-widget="calendar" data-label="Calendar"><i data-lucide="calendar"></i></button>
        <div class="rail-sep"></div>
        <button data-widget="text" data-label="Text box"><i data-lucide="type"></i></button>
        <button data-widget="names" data-label="Random name"><i data-lucide="shuffle"></i></button>
        <button data-widget="dice" data-label="Dice"><i data-lucide="dices"></i></button>
        <div class="rail-sep"></div>
        <button data-widget="traffic" data-label="Traffic light"><i data-lucide="traffic-cone"></i></button>
        <button data-widget="symbols" data-label="Work symbols"><i data-lucide="users"></i></button>
        <button data-widget="noise" data-label="Noise meter"><i data-lucide="volume-2"></i></button>
        <button data-widget="qr" data-label="QR code"><i data-lucide="qr-code"></i></button>
        <button data-widget="cat" data-label="Wandering cat"><i data-lucide="cat"></i></button>
        <div class="rail-sep"></div>
        <button id="btn-widgets-clear" data-label="Close all widgets"><i data-lucide="x-circle"></i></button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, doc, setDoc, deleteDoc, writeBatch } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        lucide.createIcons();

        // ─── STATE ────────────────────────────────────────────────────────────────────
        const ui = { tool: 'pen', thickness: 3, color: '#000000', eraseMode: 'stroke', showGrid: true, touchMode: localStorage.getItem('whiteboard.touchMode') || 'draw', eink: localStorage.getItem('whiteboard.eink') === '1' };
        const view = { x: 0, y: 0, zoom: 1 };

        let strokes = [];          // ground truth from Firestore
        let undoStack = [];        // array of {type:'add'|'delete', strokes:[...]} for undo
        let isDirty = true;

        // Offscreen buffer: strokes are rendered here; only overlayCanvas is drawn fresh per frame
        const offscreen = document.createElement('canvas');
        const offCtx = offscreen.getContext('2d', { alpha: true });
        let offscreenDirty = true; // needs full redraw
        let offscreenView = { x: null, y: null, zoom: null }; // last view used to render offscreen

        const activePointers = new Map();
        let isDrawing = false;
        let isPanning = false;
        let currentStroke = null;
        let lastPt = null;
        let initialPinchDistance = null;
        let initialView = null;
        let initialPinchCenter = null;

        // Minimum distance squared to add a new point during drawing (reduces micro-movements)

            } else if (action.type === 'delete') {
                // Re-add the deleted strokes
                for (const s of action.strokes) {
                    strokes.push(s);
                    if (user) {
                        const payload = {
                            type: s.type, color: s.color, thickness: s.thickness,
                            points: JSON.stringify(s.points.map(p => [+p.x.toFixed(1), +p.y.toFixed(1)])), timestamp: s.timestamp || Date.now()
                        };
                        setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'strokes', s.id), payload).catch(() => { });
                    }
                }
                strokes.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
            }
            offscreenDirty = true; isDirty = true;
        }

        // ─── UI / TOOLBAR ─────────────────────────────────────────────────────────────
        function updateZoomUI() {
            document.getElementById('btn-zoom-reset').innerText = `${Math.round(view.zoom * 100)}%`;
        }
        function applyZoomDelta(delta) {
            const cx = window.innerWidth / 2, cy = window.innerHeight / 2;
            const wx = (cx - view.x) / view.zoom, wy = (cy - view.y) / view.zoom;
            view.zoom = Math.min(Math.max(0.1, view.zoom * delta), 10);
            view.x = cx - wx * view.zoom; view.y = cy - wy * view.zoom;
            offscreenDirty = true; isDirty = true; updateZoomUI();
        }
        document.getElementById('btn-zoom-in').onclick = () => applyZoomDelta(1.25);
        document.getElementById('btn-zoom-out').onclick = () => applyZoomDelta(0.8);
        document.getElementById('btn-zoom-reset').onclick = () => { view.zoom = 1; view.x = 0; view.y = 0; offscreenDirty = true; isDirty = true; updateZoomUI(); };

        function updateCursor() {
            if (ui.tool === 'pan') overlayCanvas.style.cursor = isPanning ? 'grabbing' : 'grab';
            else if (ui.tool === 'eraser') overlayCanvas.style.cursor = 'cell';
            else overlayCanvas.style.cursor = 'crosshair';
        }

        function updateUI() {
            document.querySelectorAll('.tool-btn').forEach(b => {
                b.classList.remove('active', 'bg-blue-600', 'text-white', 'shadow-md');
                b.classList.add('text-gray-600', 'hover:bg-gray-100');
            });
            const ab = document.getElementById(`btn-${ui.tool}`);
            if (ab) { ab.classList.remove('text-gray-600', 'hover:bg-gray-100'); ab.classList.add('active', 'bg-blue-600', 'text-white', 'shadow-md'); }

            const gridBtn = document.getElementById('btn-grid');
            if (ui.showGrid) { gridBtn.classList.add('text-blue-600', 'bg-blue-50'); gridBtn.classList.remove('text-gray-600', 'hover:bg-gray-100'); }
            else { gridBtn.classList.remove('text-blue-600', 'bg-blue-50'); gridBtn.classList.add('text-gray-600', 'hover:bg-gray-100'); }

            const eraserOpts = document.getElementById('eraser-options');
            if (ui.tool === 'eraser') {
                eraserOpts.classList.remove('hidden');
                const cls = (active) => active ? 'px-4 py-1.5 text-sm rounded-lg bg-blue-100 text-blue-700 font-bold transition' : 'px-4 py-1.5 text-sm rounded-lg hover:bg-gray-100 text-gray-600 font-medium transition';
                document.getElementById('btn-erase-stroke').className = cls(ui.eraseMode === 'stroke');
                document.getElementById('btn-erase-partial').className = cls(ui.eraseMode === 'partial');
            } else {
                eraserOpts.classList.add('hidden');
            }

            document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
            const ac = document.querySelector(`.color-btn[data-color="${ui.color}"]`);
            if (ac) ac.classList.add('active');
            updateCursor();
        }

        function switchTool(t) { abortCurrentStroke(); ui.tool = t; updateUI(); }

        document.getElementById('btn-pen').onclick = () => switchTool('pen');
        document.getElementById('btn-eraser').onclick = () => switchTool('eraser');
        document.getElementById('btn-arrow').onclick = () => switchTool('arrow');
        document.getElementById('btn-rect').onclick = () => switchTool('rect');
        document.getElementById('btn-circle').onclick = () => switchTool('circle');
        document.getElementById('btn-pan').onclick = () => switchTool('pan');
        document.getElementById('btn-grid').onclick = () => { ui.showGrid = !ui.showGrid; isDirty = true; updateUI(); };
        function updateTouchBtn() {
            const b = document.getElementById('btn-touch');
            const pan = ui.touchMode === 'pan';
            b.innerHTML = `<i data-lucide="${pan ? 'hand' : 'pointer'}" class="w-5 h-5"></i>`;
            b.title = pan ? 'Finger pans, stylus draws (tap to switch)' : 'Finger draws (tap to switch)';
            b.classList.toggle('text-blue-600', pan); b.classList.toggle('bg-blue-50', pan);
            lucide.createIcons({ nodes: b.querySelectorAll('[data-lucide]') });
        }
        document.getElementById('btn-touch').onclick = () => {
            ui.touchMode = ui.touchMode === 'pan' ? 'draw' : 'pan';
            localStorage.setItem('whiteboard.touchMode', ui.touchMode); updateTouchBtn();
        };
        updateTouchBtn();
        function applyEink() {
            document.body.classList.toggle('eink', ui.eink);
            const b = document.getElementById('btn-eink');
            b.classList.toggle('text-blue-600', ui.eink); b.classList.toggle('bg-blue-50', ui.eink);
            resize(); // re-evaluates pixel ratio
        }
        document.getElementById('btn-eink').onclick = () => {
            ui.eink = !ui.eink; localStorage.setItem('whiteboard.eink', ui.eink ? '1' : '0'); applyEink();
        };
        // Boox browsers identify themselves in the user agent; default to e-ink mode there the first time
        if (localStorage.getItem('whiteboard.eink') === null && /boox|onyx|eink|remarkable/i.test(navigator.userAgent)) {
            ui.eink = true; localStorage.setItem('whiteboard.eink', '1');
        }
        applyEink();
        // Hide the touch toggle on devices with no touch input at all
        if (!('ontouchstart' in window) && !navigator.maxTouchPoints) document.getElementById('btn-touch').style.display = 'none';
        document.getElementById('btn-erase-stroke').onclick = () => { ui.eraseMode = 'stroke'; updateUI(); };
        document.getElementById('btn-erase-partial').onclick = () => { ui.eraseMode = 'partial'; updateUI(); };

        document.querySelectorAll('.color-btn').forEach(btn => {
            btn.onclick = e => {
                ui.color = e.target.dataset.color;
                if (!['pen', 'arrow', 'rect', 'circle'].includes(ui.tool)) switchTool('pen');
                updateUI();
            };
        });
        document.getElementById('thickness-slider').oninput = e => { ui.thickness = parseInt(e.target.value); };
        document.getElementById('btn-undo').onclick = undo;
        document.getElementById('btn-clear').onclick = async () => {
            abortCurrentStroke();
            const all = [...strokes];
            undoStack.push({ type: 'delete', strokes: all });
            if (user) all.forEach(s => deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'strokes', s.id)).catch(() => { }));
            strokes = []; offscreenDirty = true; isDirty = true;
        };

        let spacePressed = false, previousTool = ui.tool;
        window.addEventListener('keydown', e => {
            if (e.key === 'z' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); undo(); return; }
            if (e.code === 'Space' && !spacePressed && !['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)) {
                spacePressed = true; previousTool = ui.tool; switchTool('pan');
            }
        });
        window.addEventListener('keyup', e => {
            if (e.code === 'Space') { spacePressed = false; switchTool(previousTool); }
        });

        // iOS Safari: block pinch-zoom of the page itself and double-tap zoom on toolbars
        ['gesturestart', 'gesturechange', 'gestureend'].forEach(ev => document.addEventListener(ev, e => e.preventDefault(), { passive: false }));
        let lastTouchEnd = 0;
        document.addEventListener('touchend', e => {
            const now = Date.now();
            if (now - lastTouchEnd < 300 && !e.target.closest('textarea, input, select')) e.preventDefault();
            lastTouchEnd = now;
        }, { passive: false });

        updateUI(); updateZoomUI();
    </script>

    <script>
        // ═══════════════════════════════════════════════════════════════════════
        //  WIDGETS — Classroomscreen-style floating tools that sit over the board.
        //  Widgets are screen-fixed (they don't pan/zoom with the canvas) and are
        //  saved to localStorage so they come back on reload. They're local to
        //  this device; strokes are still synced through Firebase.
        // ═══════════════════════════════════════════════════════════════════════
        (() => {
            const layer = document.getElementById('widget-layer');
            const STORAGE_KEY = 'whiteboard.widgets.v1';
            const widgets = new Map();          // id -> { el, type, state, cleanup }
            let zTop = 100;
            let saveTimer = null;

            const save = () => {
                clearTimeout(saveTimer);
                saveTimer = setTimeout(() => {
                    const out = [];
                    for (const [id, w] of widgets) {
                        const r = w.el;
                        out.push({ id, type: w.type, x: r.offsetLeft, y: r.offsetTop, w: r.offsetWidth, h: r.offsetHeight, state: w.state });
                    }
                    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(out)); } catch (e) { }
                }, 150);
            };

            const icon = name => { const i = document.createElement('i'); i.setAttribute('data-lucide', name); return i; };
            const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
            const pad = n => String(n).padStart(2, '0');
            const fmtTime = ms => {
                const t = Math.max(0, Math.round(ms / 1000));
                const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
                return h > 0 ? `${h}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
            };
            // Fit readout font to widget width
            const fitReadout = (widget, chars) => {
                const w = widget.offsetWidth - 40;
                widget.style.setProperty('--readout', `${Math.max(24, Math.min(160, w / (chars * 0.62)))}px`);
            };

            // Alarm sound without any assets — a few short beeps
            let audioCtx = null;
            function beep(times = 3) {
                try {
                    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
                    for (let i = 0; i < times; i++) {
                        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
                        o.type = 'sine'; o.frequency.value = 880;
                        g.gain.value = 0.0001;
                        o.connect(g); g.connect(audioCtx.destination);
                        const t = audioCtx.currentTime + i * 0.35;
                        g.gain.setValueAtTime(0.0001, t);
                        g.gain.exponentialRampToValueAtTime(0.3, t + 0.02);
                        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.25);
                        o.start(t); o.stop(t + 0.3);
                    }
                } catch (e) { }
            }

            // School-bell chime (from the classroom file)
            function bell() {
                try {
                    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
                    if (audioCtx.state === 'suspended') audioCtx.resume();
                    const o1 = audioCtx.createOscillator(), o2 = audioCtx.createOscillator(), g = audioCtx.createGain(), t = audioCtx.currentTime;
                    o1.type = 'sine'; o1.frequency.value = 880; o2.type = 'triangle'; o2.frequency.value = 440;
                    g.gain.setValueAtTime(0.5, t); g.gain.exponentialRampToValueAtTime(0.01, t + 1.2);
                    [o1, o2].forEach(o => { o.connect(g); o.start(t); o.stop(t + 1.2); });
                    g.connect(audioCtx.destination);
                } catch (e) { }
            }

            // Fireworks overlay — fired when a timer finishes
            const fw = document.getElementById('fireworks-canvas'), fwCtx = fw.getContext('2d');
            let particles = [];
            const sizeFw = () => { fw.width = innerWidth; fw.height = innerHeight; };
            addEventListener('resize', sizeFw); sizeFw();
            function fireworks() {
                const palette = ['#ff0055', '#00ffcc', '#ffcc00', '#ff00ff', '#00ff00', '#2288ff'];
                for (let b = 0; b < 5; b++) setTimeout(() => {
                    const tx = fw.width * (0.2 + Math.random() * 0.6), ty = fw.height * (0.15 + Math.random() * 0.4), c = palette[b % palette.length];
                    for (let p = 0; p < 60; p++) {
                        const a = Math.random() * Math.PI * 2, sp = Math.random() * 6 + 2;
                        particles.push({ x: tx, y: ty, c, r: Math.random() * 2.5 + 1, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, al: 1, d: Math.random() * 0.015 + 0.015 });
                    }
                    bell();
                }, b * 220);
                if (!fwRunning) { fwRunning = true; requestAnimationFrame(fwLoop); }
            }
            let fwRunning = false;
            function fwLoop() {
                fwCtx.clearRect(0, 0, fw.width, fw.height);
                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    p.vx *= 0.98; p.vy = p.vy * 0.98 + 0.06; p.x += p.vx; p.y += p.vy; p.al -= p.d;
                    if (p.al <= 0) { particles.splice(i, 1); continue; }
                    fwCtx.globalAlpha = p.al; fwCtx.fillStyle = p.c; fwCtx.beginPath(); fwCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2); fwCtx.fill();
                }
                fwCtx.globalAlpha = 1;
                if (particles.length) requestAnimationFrame(fwLoop); else fwRunning = false;
            }

            // ─── Widget definitions ──────────────────────────────────────────
            // Each returns { title, icon, w, h, mount(body, state, ctx) -> cleanup? }
            const DEFS = {
                clock: {
                    title: 'Clock', icon: 'clock', w: 300, h: 170,
                    mount(body, state, ctx) {
                        state.h24 = state.h24 ?? false;
                        const read = el('div', 'readout');
                        const date = el('div', 'text-center text-sm text-gray-500 font-medium');
                        const tog = el('button', 'wbtn small self-center mt-2');
                        body.append(read, date, tog);
                        const tick = () => {
                            const d = new Date();
                            let h = d.getHours(), suffix = '';
                            if (!state.h24) { suffix = h >= 12 ? ' PM' : ' AM'; h = h % 12 || 12; }
                            read.textContent = `${state.h24 ? pad(h) : h}:${pad(d.getMinutes())}${suffix}`;
                            date.textContent = d.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
                            tog.textContent = state.h24 ? '24h' : '12h';
                            fitReadout(ctx.widget, state.h24 ? 5 : 8);
                        };
                        tog.onclick = () => { state.h24 = !state.h24; tick(); save(); };
                        tick();
                        const id = setInterval(tick, 1000);
                        ctx.onResize(tick);
                        return () => clearInterval(id);
                    }
                },

                timer: {
                    title: 'Timer', icon: 'timer', w: 320, h: 230,
                    mount(body, state, ctx) {
                        state.total = state.total ?? 5 * 60 * 1000;   // ms configured
                        state.remaining = state.remaining ?? state.total;
                        state.running = false; state.endAt = null;
                        let fired = false;

                        const read = el('div', 'readout');
                        const bar = el('div', 'h-1.5 rounded-full bg-gray-100 overflow-hidden my-2');
                        const fill = el('div', 'h-full bg-blue-600 rounded-full'); bar.append(fill);
                        const presets = el('div', 'flex flex-wrap gap-1 justify-center');
                        [1, 2, 5, 10, 15, 30].forEach(m => {
                            const b = el('button', 'wbtn small', `${m}m`);
                            b.onclick = () => { stop(); state.total = state.remaining = m * 60000; render(); save(); };
                            presets.append(b);
                        });
                        const custom = el('input', 'wbtn small w-14 text-center');
                        custom.type = 'number'; custom.min = 1; custom.placeholder = 'min';
                        custom.onchange = () => { const m = parseFloat(custom.value); if (m > 0) { stop(); state.total = state.remaining = m * 60000; render(); save(); } custom.value = ''; };
                        presets.append(custom);
                        const row = el('div', 'flex gap-2 justify-center mt-2');
                        const start = el('button', 'wbtn primary', 'Start');
                        const reset = el('button', 'wbtn', 'Reset');
                        row.append(start, reset);
                        body.append(read, bar, presets, row);

                        const render = () => {
                            read.textContent = fmtTime(state.remaining);
                            read.style.color = state.remaining <= 0 ? '#dc2626' : (state.remaining <= 10000 && state.running ? '#ea580c' : '');
                            fill.style.width = `${Math.max(0, state.remaining / state.total) * 100}%`;
                            start.textContent = state.running ? 'Pause' : 'Start';
                            fitReadout(ctx.widget, read.textContent.length);
                        };
                        const stop = () => { state.running = false; state.endAt = null; };
                        const tick = () => {
                            if (!state.running) return;
                            state.remaining = state.endAt - Date.now();
                            if (state.remaining <= 0) {
                                state.remaining = 0; stop();
                                if (!fired) { fired = true; fireworks(); ctx.widget.animate([{ background: '#fecaca' }, { background: '' }], { duration: 1200, iterations: 3 }); }
                            }
                            render();
                        };
                        start.onclick = () => {
                            if (state.running) { stop(); }
                            else {
                                if (state.remaining <= 0) state.remaining = state.total;
                                fired = false; state.running = true; state.endAt = Date.now() + state.remaining;
                                if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
                            }
                            render(); save();
                        };
                        reset.onclick = () => { stop(); state.remaining = state.total; fired = false; render(); save(); };
                        render();
                        const id = setInterval(tick, 200);
                        ctx.onResize(render);
                        return () => clearInterval(id);
                    }
                },

                stopwatch: {
                    title: 'Stopwatch', icon: 'watch', w: 300, h: 190,
                    mount(body, state, ctx) {
                        state.elapsed = state.elapsed ?? 0; let running = false, startAt = 0;
                        const read = el('div', 'readout');
                        const row = el('div', 'flex gap-2 justify-center mt-2');
                        const start = el('button', 'wbtn primary', 'Start');
                        const reset = el('button', 'wbtn', 'Reset');
                        row.append(start, reset); body.append(read, row);
                        const now = () => running ? state.elapsed + (Date.now() - startAt) : state.elapsed;
                        const render = () => {
                            const ms = now();
                            read.textContent = `${fmtTime(ms)}.${pad(Math.floor((ms % 1000) / 10))}`;
                            start.textContent = running ? 'Pause' : 'Start';
                            fitReadout(ctx.widget, read.textContent.length);
                        };
                        start.onclick = () => {
                            if (running) { state.elapsed = now(); running = false; save(); }
                            else { startAt = Date.now(); running = true; }
                            render();
                        };
                        reset.onclick = () => { running = false; state.elapsed = 0; render(); save(); };
                        render();
                        const id = setInterval(() => { if (running) render(); }, 50);
                        ctx.onResize(render);
                        return () => clearInterval(id);
                    }
                },

                calendar: {
                    title: 'Calendar', icon: 'calendar', w: 300, h: 300,
                    mount(body, state, ctx) {
                        const today = new Date();
                        let y = today.getFullYear(), m = today.getMonth();
                        const head = el('div', 'flex items-center justify-between mb-2');
                        const prev = el('button', 'wbtn small', '‹'), next = el('button', 'wbtn small', '›');
                        const label = el('div', 'font-bold text-gray-800');
                        head.append(prev, label, next);
                        const grid = el('div', 'grid grid-cols-7 gap-1 text-center text-sm flex-1');
                        body.append(head, grid);
                        const render = () => {
                            label.textContent = new Date(y, m, 1).toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
                            grid.innerHTML = '';
                            ['S', 'M', 'T', 'W', 'T', 'F', 'S'].forEach(d => grid.append(el('div', 'text-xs font-bold text-gray-400', d)));
                            const first = new Date(y, m, 1).getDay(), days = new Date(y, m + 1, 0).getDate();
                            for (let i = 0; i < first; i++) grid.append(el('div'));
                            for (let d = 1; d <= days; d++) {
                                const isToday = d === today.getDate() && m === today.getMonth() && y === today.getFullYear();
                                grid.append(el('div', 'rounded-lg py-1 flex items-center justify-center ' + (isToday ? 'bg-blue-600 text-white font-bold' : 'text-gray-700'), d));
                            }
                        };
                        prev.onclick = () => { m--; if (m < 0) { m = 11; y--; } render(); };
                        next.onclick = () => { m++; if (m > 11) { m = 0; y++; } render(); };
                        render();
                    }
                },

                text: {
                    title: 'Text', icon: 'type', w: 340, h: 220,
                    mount(body, state, ctx) {
                        state.text = state.text ?? ''; state.size = state.size ?? 22;
                        const ta = el('textarea', 'flex-1 w-full resize-none leading-snug');
                        ta.placeholder = 'Type here…'; ta.value = state.text;
                        ta.style.fontSize = state.size + 'px';
                        const bar = el('div', 'flex gap-1 justify-end mt-2');
                        const minus = el('button', 'wbtn small', 'A−'), plus = el('button', 'wbtn small', 'A+');
                        minus.onclick = () => { state.size = Math.max(12, state.size - 2); ta.style.fontSize = state.size + 'px'; save(); };
                        plus.onclick = () => { state.size = Math.min(96, state.size + 2); ta.style.fontSize = state.size + 'px'; save(); };
                        bar.append(minus, plus); body.append(ta, bar);
                        ta.oninput = () => { state.text = ta.value; save(); };
                        // Stop board shortcuts (space → pan) while typing
                        ta.addEventListener('keydown', e => e.stopPropagation());
                        ta.addEventListener('keyup', e => e.stopPropagation());
                        setTimeout(() => ta.focus(), 0);
                    }
                },

                names: {
                    title: 'Random name', icon: 'shuffle', w: 320, h: 300,
                    mount(body, state, ctx) {
                        state.names = state.names ?? ''; state.noRepeat = state.noRepeat ?? true;
                        let used = new Set();
                        const result = el('div', 'readout');
                        result.style.fontFamily = 'inherit';
                        result.textContent = '?';
                        const ta = el('textarea', 'w-full text-sm border border-gray-200 rounded-lg p-2 resize-none');
                        ta.rows = 4; ta.placeholder = 'One name per line'; ta.value = state.names;
                        ta.oninput = () => { state.names = ta.value; used.clear(); save(); };
                        ta.addEventListener('keydown', e => e.stopPropagation());
                        ta.addEventListener('keyup', e => e.stopPropagation());
                        const row = el('div', 'flex items-center gap-2 mt-2');
                        const pick = el('button', 'wbtn primary flex-1', 'Pick a name');
                        const rep = el('label', 'flex items-center gap-1 text-xs text-gray-500');
                        const cb = el('input'); cb.type = 'checkbox'; cb.checked = state.noRepeat;
                        cb.onchange = () => { state.noRepeat = cb.checked; used.clear(); save(); };
                        rep.append(cb, 'No repeats');
                        const editBtn = el('button', 'wbtn small', 'Edit');
                        row.append(pick, editBtn);
                        body.append(result, row, rep, ta);
                        ta.style.display = state.names ? 'none' : '';
                        editBtn.onclick = () => { ta.style.display = ta.style.display === 'none' ? '' : 'none'; if (ta.style.display !== 'none') ta.focus(); };
                        pick.onclick = () => {
                            const all = state.names.split('\n').map(s => s.trim()).filter(Boolean);
                            if (!all.length) { ta.style.display = ''; ta.focus(); return; }
                            let pool = state.noRepeat ? all.filter(n => !used.has(n)) : all;
                            if (!pool.length) { used.clear(); pool = all; }
                            // quick shuffle animation, then land
                            let n = 0; pick.disabled = true;
                            const spin = setInterval(() => {
                                result.textContent = all[Math.floor(Math.random() * all.length)];
                                if (++n > 12) {
                                    clearInterval(spin);
                                    const chosen = pool[Math.floor(Math.random() * pool.length)];
                                    used.add(chosen); result.textContent = chosen; pick.disabled = false;
                                    fit();
                                }
                            }, 60);
                        };
                        const fit = () => fitReadout(ctx.widget, Math.max(4, result.textContent.length));
                        fit(); ctx.onResize(fit);
                    }
                },

                dice: {
                    title: 'Dice', icon: 'dices', w: 260, h: 200,
                    mount(body, state, ctx) {
                        state.count = state.count ?? 1; state.values = state.values ?? [1];
                        const area = el('div', 'flex-1 flex items-center justify-center gap-3 flex-wrap');
                        const total = el('div', 'text-center text-sm text-gray-500 font-semibold');
                        const row = el('div', 'flex gap-2 justify-center mt-2 items-center');
                        const roll = el('button', 'wbtn primary', 'Roll');
                        const cnt = el('select', 'wbtn small');
                        [1, 2, 3].forEach(n => { const o = el('option', '', `${n} ${n > 1 ? 'dice' : 'die'}`); o.value = n; cnt.append(o); });
                        cnt.value = state.count;
                        row.append(roll, cnt); body.append(area, total, row);
                        const PIPS = { 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };
                        const render = () => {
                            area.innerHTML = '';
                            state.values.forEach(v => {
                                const d = el('div', 'die');
                                for (let i = 0; i < 9; i++) { const s = el('span'); if (PIPS[v].includes(i)) s.classList.add('on'); d.append(s); }
                                area.append(d);

                            total.textContent = state.values.length > 1 ? `Total: ${state.values.reduce((a, b) => a + b, 0)}` : '';
                        };
                        roll.onclick = () => {
                            state.values = Array.from({ length: state.count }, () => 1 + Math.floor(Math.random() * 6));
                            render(); area.querySelectorAll('.die').forEach(d => d.classList.add('rolling')); save();
                        };
                        cnt.onchange = () => { state.count = +cnt.value; state.values = Array.from({ length: state.count }, () => 1 + Math.floor(Math.random() * 6)); render(); save(); };
                        render();
                    }
                },

                traffic: {
                    title: 'Traffic light', icon: 'traffic-cone', w: 160, h: 320,
                    mount(body, state, ctx) {
                        state.on = state.on ?? 'green';
                        const box = el('div', 'flex-1 flex flex-col justify-around gap-2 rounded-2xl bg-slate-800 p-3');
                        const lamps = { red: '#ef4444', yellow: '#facc15', green: '#22c55e' };
                        for (const [k, c] of Object.entries(lamps)) {
                            const l = el('div', 'tl-lamp'); l.style.background = c; l.style.color = c; l.dataset.k = k;
                            l.onclick = () => { state.on = state.on === k ? null : k; render(); save(); };
                            box.append(l);

                        body.append(box);
                        const render = () => box.querySelectorAll('.tl-lamp').forEach(l => l.classList.toggle('on', l.dataset.k === state.on));
                        render();

                },

                symbols: {
                    title: 'Work symbols', icon: 'users', w: 300, h: 150,
                    mount(body, state, ctx) {
                        state.mode = state.mode ?? 'silence';
                        const SYMS = [['silence', 'mic-off', 'Silence'], ['whisper', 'ear', 'Whisper'], ['partner', 'user-round', 'Partner'], ['group', 'users', 'Group work'], ['ask', 'hand', 'Ask']];
                        const grid = el('div', 'grid grid-cols-5 gap-1 flex-1 items-center');
                        SYMS.forEach(([k, ic, lb]) => {
                            const b = el('button', 'sym-btn'); b.dataset.k = k; b.append(icon(ic), el('span', '', lb));

                            grid.append(b);

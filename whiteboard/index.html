<!--
═══════════════════════════════════════════════════════════════════════════════
  INFINITE WHITEBOARD + CLASSROOM WIDGETS  —  static web app (no build step)
═══════════════════════════════════════════════════════════════════════════════

  WHAT THIS IS
  A shared, infinite, zoomable whiteboard (strokes synced live through Firebase
  Firestore) with a set of Classroomscreen-style floating widgets layered on top
  (clock, timer, period/bell-schedule countdown, name picker, dice, traffic light,
  noise meter, QR code, etc). Widgets are local to the device (localStorage), NOT
  synced. Strokes ARE synced to everyone viewing the same Firebase project.

  HOW TO RUN
  Five static files in one folder, no build step. Host them anywhere static
  (GitHub Pages, Netlify, a school server). Dependencies load from CDNs:
  Tailwind (utility CSS), Lucide (icons), qrcode.js (QR widget), Firebase.
  NOTE: board.js is an ES module, so the folder must be served over http(s) —
  opening index.html directly via file:// will not load it. For local testing:
  `python3 -m http.server` in this folder, then open http://localhost:8000/.
  The Firebase config in config.js is a public web config — that is normal for
  Firebase; access is controlled by Firestore rules in the Firebase console,
  not by hiding the key.

  FILE LAYOUT
    index.html   This file. Head (CDN scripts, config.js, style.css) and the
                 <body> markup: two stacked <canvas> elements + text editor,
                 minimap, status pill, eraser options, bottom toolbar, zoom
                 controls, fireworks canvas, widget layer, widget rail. Loads
                 board.js and widgets.js at the end of <body>.
    style.css    Board styles, widget styles, e-ink mode, then the MOBILE block
                 last so it wins the CSS cascade.
    config.js    window.WHITEBOARD_CONFIG: Firebase web config, appId (which
                 Firestore board to join), default bell schedule. Change these
                 to deploy the board somewhere else. Plain script, loads first.
    board.js     THE BOARD (ES module): state, canvas setup, Firebase sync,
                 drawing helpers, render loop, pointer input
                 (pen/touch/mouse/pinch), undo, toolbar wiring, touch & e-ink
                 modes, minimap, keyboard shortcuts.
    widgets.js   THE WIDGETS (plain IIFE): sounds/fireworks helpers, a DEFS
                 table with one entry per widget type, the generic widget frame
                 (drag/resize/close/persist), rail buttons, mobile rail toggle,
                 restore on load. Runs before board.js (modules are deferred).

  KEY CONCEPTS
  • World vs screen coordinates. Strokes are stored in "world" units. The view
    object {x, y, zoom} maps world → screen:  screen = world * zoom + view.
    getCanvasPoint() does the inverse. Pan changes view.x/y; zoom changes
    view.zoom around the cursor/pinch point.
  • Three canvases. `offscreen` holds every committed stroke rendered for the
    current view (rebuilt only when strokes or the view change). `mainCanvas`
    just blits offscreen each frame. `overlayCanvas` (top, receives all pointer
    events) shows the stroke currently being drawn and eraser cursors. This keeps
    drawing responsive: an in-progress stroke never triggers a full re-render.
  • A stroke object: { id, type: 'pen'|'eraser'|'arrow'|'rect'|'circle'|'image',
    color, thickness, points: [{x,y}, ...], timestamp }. Pen/eraser have many
    points; shapes have exactly two (start, end). 'eraser' type is a *partial*
    eraser stroke rendered with destination-out compositing; *stroke* erase
    deletes whole stroke documents instead.
  • Pasted images are ALSO stroke documents, type:'image', living in the same
    Firestore collection so they get sync/undo/erase/clear for free. Shape:
    points:[{x,y}] is the WORLD top-left corner, plus w/h (world size) and
    src (a compressed data: URL). Firestore caps a document at ~1MB, so
    compressImageToDataURL() downscales/re-encodes until the base64 fits a
    budget; if even the smallest attempt is too big the image stays local-only
    for this session (a toast explains this) rather than failing the write.
    Because <canvas> needs a decoded bitmap (not a string) to draw, `imageCache`
    (Map id → HTMLImageElement) holds one lazily-loaded Image per image
    stroke; drawEntity()'s 'image' branch just blits whatever's cached.
    A dedicated "select" tool (ui.tool === 'select') is how images get moved,
    resized (bottom-right handle) and deleted (Delete/Backspace) — see
    `objectDrag` / `selectedObjectId` / `drawSelectionBox()` in the INPUT section.
  • Text is the second "object" type: type:'text' with text, color, size (font
    px in world units), and w/h measured by measureText(). Typing happens in a
    single reused <textarea id="text-editor"> positioned over the world point
    (openTextEditor / commitTextEdit); while it's open the canvas skips drawing
    that stroke. Click away or Ctrl+Enter commits, Escape cancels. The select
    tool moves text, its handle scales the font size, and double-click re-opens
    the editor. Undo 'update' actions carry text/size as well as geometry.
  • Minimap (#minimap, bottom-left): drawMinimap() runs from redrawMain(),
    throttled, showing content bounds ∪ viewport with pen strokes sampled to
    ~40 points. Click/drag jumps the view; double-click = fitToContent().
    Toggle (map button in zoom controls) persists in localStorage. Hidden on
    screens ≤820px wide.
    Everything else (pen/eraser/shapes/pan/widgets) is untouched by this.
  • Firestore path: artifacts/{appId}/public/data/strokes/{strokeId}.
    Every stroke is one document. onSnapshot keeps the local `strokes` array
    equal to the collection; local edits are optimistic (applied immediately,
    then written). Long pen strokes are chunked every 150 points so they start
    syncing before the user lifts the pen.
  • Undo is a local stack of {type:'add'|'delete', strokes:[...]}; undoing
    an add deletes those docs, undoing a delete re-writes them.
  • Widgets are DOM elements, absolutely positioned inside #widget-layer with
    pointer-events re-enabled per widget. They don't know about the canvas.
    Each widget type in DEFS has mount(body, state, ctx): build the UI into
    `body`, keep persistent data on `state` (auto-saved), and optionally return
    a cleanup function (clear intervals, stop mic, etc).

  INPUT MODEL (pointer events)
  • Mouse left = current tool. Mouse right (held) = temporary stroke eraser.
  • Wheel = zoom at cursor. Space (held) = temporary pan. Ctrl/Cmd+Z = undo.
  • Touch: one finger = current tool OR pan (see ui.touchMode toggle);
    two fingers = pinch zoom + pan. Stylus always draws; while a stylus is
    down, finger touches are ignored (palm rejection).
  • Ctrl/Cmd+V (or a drag-and-drop of an image file onto the board) pastes an
    image as a new stroke, auto-selects it, and switches to the "select" tool
    so it can be repositioned immediately. Pasting into a widget's own text
    field is untouched — the paste handler only intercepts when the clipboard
    actually contains image data.
  • The ">>" button in the zoom controls jumps to blank space: slides right
    along the top row (world y = 0) so the screen's left edge sits JUMP_GAP px
    past the right-most thing visible, nudging further until the view is
    clear. Nothing in view → step one full screen. See jumpToBlankSpace().

  DEVICE MODES
  • ui.touchMode ('draw'|'pan'): what a single finger does. Saved in localStorage.
  • ui.eink (bool): removes blur/shadows/animations/grid, and nudges a style
    each redraw so e-ink panels (Boox) flush the canvas. Manual toggle only
    (no auto-detect). Saved in localStorage.

  ADDING A WIDGET (for future edits)
    1. Add a button in #widget-rail (index.html):  <button data-widget="foo" data-label="Foo">
    2. In widgets.js add DEFS.foo = { title, icon (lucide name), w, h, mount(body, state, ctx) }
    That's it — drag, resize, close, focus, persistence and mobile clamping are
    handled by addWidget().

  ADDING A DRAWING TOOL (board.js + index.html)
    Add a button with id="btn-<tool>" in index.html, handle it in pointerdown/pointermove,
    add a draw<Tool>() and a branch in drawEntity(), and (for stroke erase)
    a branch in strokeHitTest().
═══════════════════════════════════════════════════════════════════════════════
-->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Infinite Whiteboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="config.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="canvas-container">
        <canvas id="mainCanvas"></canvas>
        <canvas id="overlayCanvas"></canvas>
        <!-- In-place editor for the text tool. Positioned in screen px over the world point being
             edited, font-size scaled by view.zoom. Hidden unless a text is being typed/edited. -->
        <textarea id="text-editor" spellcheck="false" rows="1"></textarea>
    </div>

    <!-- Minimap: bird's-eye view of everything on the board + the current viewport (blue box).
         Click/drag to move the view; double-click to zoom-to-fit all content. Hidden on small screens. -->
    <canvas id="minimap" width="200" height="130" title="Minimap — click to jump, double-click to fit all"></canvas>

    <!-- Status: Firebase connection indicator (green pulse = live, red = offline). -->
    <div id="status-pill"
        class="fixed top-4 right-4 bg-white/90 backdrop-blur-md rounded-xl shadow border border-gray-200 px-4 py-2 flex items-center gap-2 z-50">
        <div id="status-dot" class="w-2.5 h-2.5 rounded-full bg-gray-400"></div>
        <span id="status-text" class="text-sm font-medium text-gray-700">Connecting...</span>
    </div>

    <!-- Eraser Options: shown only while the eraser tool is active.
         Stroke erase = delete whole strokes you touch. Partial erase = paint transparency over them. -->
    <div id="eraser-options"
        class="hidden fixed bottom-24 left-1/2 transform -translate-x-1/2 bg-white/95 backdrop-blur-md rounded-xl shadow-lg border border-gray-200/50 p-1.5 flex gap-1 z-50">
        <button id="btn-erase-stroke"
            class="px-4 py-1.5 text-sm rounded-lg bg-blue-100 text-blue-700 font-bold transition">Stroke Erase</button>
        <button id="btn-erase-partial"
            class="px-4 py-1.5 text-sm rounded-lg hover:bg-gray-100 text-gray-600 font-medium transition">Partial
            Erase</button>
    </div>

    <!-- Toolbar: tools (id="btn-<tool>" is matched by updateUI()), colors (data-color), thickness, undo, clear.
         On small screens this scrolls horizontally (see MOBILE CSS). -->
    <div id="toolbar"
        class="fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-white/95 backdrop-blur-md rounded-2xl shadow-[0_8px_30px_rgb(0,0,0,0.12)] border border-gray-200/50 p-1.5 flex items-center gap-1 z-50">
        <button id="btn-pen" class="tool-btn active text-gray-600 p-2 rounded-lg transition-all duration-200"
            title="Pen"><i data-lucide="pen" class="w-5 h-5"></i></button>
        <button id="btn-eraser"
            class="tool-btn text-gray-600 p-2 rounded-lg hover:bg-gray-100 transition-all duration-200"
            title="Eraser"><i data-lucide="eraser" class="w-5 h-5"></i></button>
        <div class="w-[1px] h-6 bg-gray-200 mx-1"></div>
        <button id="btn-arrow"
            class="tool-btn text-gray-600 p-2 rounded-lg hover:bg-gray-100 transition-all duration-200" title="Arrow"><i
                data-lucide="arrow-up-right" class="w-5 h-5"></i></button>
        <button id="btn-rect"
            class="tool-btn text-gray-600 p-2 rounded-lg hover:bg-gray-100 transition-all duration-200"
            title="Rectangle"><i data-lucide="square" class="w-5 h-5"></i></button>
        <button id="btn-circle"
            class="tool-btn text-gray-600 p-2 rounded-lg hover:bg-gray-100 transition-all duration-200"
            title="Circle"><i data-lucide="circle" class="w-5 h-5"></i></button>
        <button id="btn-text"
            class="tool-btn text-gray-600 p-2 rounded-lg hover:bg-gray-100 transition-all duration-200"
            title="Text (click to type; Ctrl+Enter or click away to finish)"><i data-lucide="type" class="w-5 h-5"></i></button>
        <div class="w-[1px] h-6 bg-gray-200 mx-1"></div>
        <button id="btn-select" class="tool-btn text-gray-600 p-2 rounded-lg hover:bg-gray-100 transition-all duration-200"
            title="Select (move/resize/delete pasted images)"><i data-lucide="mouse-pointer-2" class="w-5 h-5"></i></button>
        <button id="btn-pan" class="tool-btn text-gray-600 p-2 rounded-lg hover:bg-gray-100 transition-all duration-200"
            title="Pan"><i data-lucide="hand" class="w-5 h-5"></i></button>
        <button id="btn-touch"
            class="text-gray-600 p-2 rounded-lg hover:bg-gray-100 transition-all duration-200"
            title="Finger: draw / pan (pen always draws)"><i data-lucide="pointer" class="w-5 h-5"></i></button>
        <button id="btn-eink"
            class="text-gray-600 p-2 rounded-lg hover:bg-gray-100 transition-all duration-200"
            title="E-ink mode (Boox, reMarkable): fewer repaints, less lag"><i data-lucide="book-open" class="w-5 h-5"></i></button>
        <button id="btn-grid"
            class="text-blue-600 bg-blue-50 p-2 rounded-lg hover:bg-gray-100 transition-all duration-200"
            title="Toggle Grid"><i data-lucide="grid-3x3" class="w-5 h-5"></i></button>
        <div class="w-[1px] h-6 bg-gray-200 mx-1"></div>

        <!-- Colors -->
        <div class="flex gap-1 px-1 items-center">
            <button class="color-btn active w-5 h-5 rounded-full bg-black transition-all duration-200"
                data-color="#000000"></button>
            <button
                class="color-btn w-5 h-5 rounded-full bg-gray-500 border border-black/10 transition-all duration-200"
                data-color="#6b7280"></button>
            <button class="color-btn w-5 h-5 rounded-full bg-red-500 border border-black/10 transition-all duration-200"
                data-color="#ef4444"></button>
            <button
                class="color-btn w-5 h-5 rounded-full bg-orange-500 border border-black/10 transition-all duration-200"
                data-color="#f97316"></button>
            <button
                class="color-btn w-5 h-5 rounded-full bg-yellow-400 border border-black/10 transition-all duration-200"
                data-color="#eab308"></button>
            <button
                class="color-btn w-5 h-5 rounded-full bg-green-500 border border-black/10 transition-all duration-200"
                data-color="#22c55e"></button>
            <button
                class="color-btn w-5 h-5 rounded-full bg-blue-500 border border-black/10 transition-all duration-200"
                data-color="#3b82f6"></button>
            <button
                class="color-btn w-5 h-5 rounded-full bg-purple-500 border border-black/10 transition-all duration-200"
                data-color="#a855f7"></button>
        </div>
        <div class="w-[1px] h-6 bg-gray-200 mx-1"></div>

        <div class="px-1 flex items-center gap-1.5">
            <i data-lucide="scaling" class="w-4 h-4 text-gray-400"></i>
            <input type="range" id="thickness-slider" min="1" max="30" value="3"
                class="w-20 accent-blue-600 h-1 bg-gray-200 rounded-lg appearance-none cursor-pointer">
        </div>
        <div class="w-[1px] h-6 bg-gray-200 mx-1"></div>

        <!-- Undo -->
        <button id="btn-undo"
            class="p-2 rounded-lg hover:bg-gray-100 text-gray-400 hover:text-gray-700 transition-all duration-200"
            title="Undo (Ctrl+Z)">
            <i data-lucide="undo-2" class="w-5 h-5"></i>
        </button>
        <!-- Clear -->
        <button id="btn-clear"
            class="p-2 rounded-lg hover:bg-red-50 text-gray-400 hover:text-red-500 transition-all duration-200"
            title="Clear Board">
            <i data-lucide="trash-2" class="w-5 h-5"></i>
        </button>
    </div>

    <!-- Zoom Controls: +/- zoom around screen center; the % button resets to 100% at origin.
         The top button jumps to the next empty "page" to the right of everything drawn, on the top row (y=0). -->
    <div id="zoom-controls"
        class="fixed bottom-6 right-6 bg-white/95 backdrop-blur-md rounded-2xl shadow-[0_8px_30px_rgb(0,0,0,0.12)] border border-gray-200/50 p-1.5 flex flex-col items-center gap-1 z-50">
        <button id="btn-blank" class="text-gray-600 p-2.5 rounded-xl hover:bg-gray-100 transition-all"
            title="Jump to blank space (next empty screen to the right, top row)"><i data-lucide="chevrons-right" class="w-5 h-5"></i></button>
        <button id="btn-minimap" class="text-blue-600 bg-blue-50 p-2.5 rounded-xl hover:bg-gray-100 transition-all"
            title="Toggle minimap"><i data-lucide="map" class="w-5 h-5"></i></button>
        <div class="w-8 h-[1px] bg-gray-200 my-0.5"></div>
        <button id="btn-zoom-in" class="text-gray-600 p-2.5 rounded-xl hover:bg-gray-100 transition-all"><i
                data-lucide="plus" class="w-5 h-5"></i></button>
        <div class="w-8 h-[1px] bg-gray-200 my-0.5"></div>
        <button id="btn-zoom-reset"
            class="w-10 h-10 flex items-center justify-center text-[11px] font-bold text-gray-600 rounded-xl hover:bg-gray-100 transition-all">100%</button>
        <div class="w-8 h-[1px] bg-gray-200 my-0.5"></div>
        <button id="btn-zoom-out" class="text-gray-600 p-2.5 rounded-xl hover:bg-gray-100 transition-all"><i
                data-lucide="minus" class="w-5 h-5"></i></button>
    </div>


    <!-- Fireworks overlay: transparent full-screen canvas used only when a countdown timer finishes. -->
    <canvas id="fireworks-canvas"></canvas>

    <!-- Widget layer (floating tools sit above the canvas, screen-fixed like Classroomscreen) -->
    <div id="widget-layer"></div>

    <!-- Widget rail: one button per widget type. data-widget must match a key in DEFS (widget script).
         On desktop it's a vertical bar on the left; on small screens it's hidden behind #rail-toggle. -->
    <button id="rail-toggle"><i data-lucide="layout-grid"></i>Widgets</button>
    <div id="widget-rail">
        <button data-widget="clock" data-label="Clock"><i data-lucide="clock"></i></button>
        <button data-widget="timer" data-label="Timer"><i data-lucide="timer"></i></button>
        <button data-widget="stopwatch" data-label="Stopwatch"><i data-lucide="watch"></i></button>
        <button data-widget="schedule" data-label="Period timer / bell schedule"><i data-lucide="bell"></i></button>
        <button data-widget="calendar" data-label="Calendar"><i data-lucide="calendar"></i></button>
        <div class="rail-sep"></div>
        <button data-widget="text" data-label="Text box"><i data-lucide="type"></i></button>
        <button data-widget="names" data-label="Random name"><i data-lucide="shuffle"></i></button>
        <button data-widget="dice" data-label="Dice"><i data-lucide="dices"></i></button>
        <div class="rail-sep"></div>
        <button data-widget="traffic" data-label="Traffic light"><i data-lucide="traffic-cone"></i></button>
        <button data-widget="symbols" data-label="Work symbols"><i data-lucide="users"></i></button>
        <button data-widget="noise" data-label="Noise meter"><i data-lucide="volume-2"></i></button>
        <button data-widget="qr" data-label="QR code"><i data-lucide="qr-code"></i></button>
        <button data-widget="cat" data-label="Wandering cat"><i data-lucide="cat"></i></button>
        <div class="rail-sep"></div>
        <button id="btn-widgets-clear" data-label="Close all widgets"><i data-lucide="x-circle"></i></button>
    </div>

    <!-- ════════════════════════════ BOARD SCRIPT (ES module) — see board.js ════════════════════════════ -->
    <script type="module" src="board.js"></script>

    <!-- ════════════════════════════ WIDGET SCRIPT (plain script, runs before the module) — see widgets.js ════════════════════════════ -->
    <script src="widgets.js"></script>
</body>

</html>

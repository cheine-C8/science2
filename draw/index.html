<!DOCTYPE html>
<!--
  ============================================================================
  SKETCHPAD — a single-file drawing tool for students
  ============================================================================

  VERSION: 1.4.0        (also set in the APP_VERSION constant in the script
                         below — bump BOTH places when you change the file)

  What it is
  ----------
  A self-contained HTML page (no libraries, no internet needed) where students
  draw diagrams and export them as PNG images to paste into a formative,
  lab report, Google Doc, etc.

  How the file is organized
  -------------------------
    1. <style>   — all CSS (toolbar, canvas frame, status bar)
    2. <body>    — the toolbar buttons, the canvas, the status bar
    3. <script>  — all behavior, in sections:
         a. constants & app state
         b. undo/redo history
         c. drawing (rendering the shape list onto the canvas)
         d. tool / color / option controls
         e. mouse & touch input (pointer events)
         f. text editing (a floating contenteditable box)
         g. keyboard shortcuts
         h. export (copy to clipboard, download PNG)
         i. startup

  Core idea
  ---------
  The drawing is NOT stored as pixels. It's a list of shape objects
  (`shapes` array). Every time anything changes we clear the canvas and
  redraw every shape from that list (`draw()`). That's what makes undo,
  move, select, and editing text possible.

  Shape object formats
  --------------------
    pen     { id, type:'pen',     color, width, points:[{x,y},...] }
    line    { id, type:'line',    color, width, x1,y1,x2,y2 }
    arrow   { id, type:'arrow',   color, width, x1,y1,x2,y2 }   (head at x2,y2)
    rect    { id, type:'rect',    color, width, fill, x1,y1,x2,y2 }
    ellipse { id, type:'ellipse', color, width, fill, x1,y1,x2,y2 }
    text    { id, type:'text',    color, size,  x,y, text }

  All coordinates are in "canvas units" (0..960 wide, 0..600 tall), no matter
  how big or small the canvas is displayed on screen. `pos()` converts mouse
  positions to these units.

  ============================================================================
  NOTES FOR OTHER LLMs / FUTURE EDITORS
  ============================================================================
  - Keep this a single file with zero dependencies. Students open it directly
    from a file, a shared drive, or an LMS link; there may be no internet.
  - Bump APP_VERSION (script) and the VERSION line in this header on every
    change. Use semver-ish: bug fix -> x.x.+1, new feature -> x.+1.0.
    Add a line to the CHANGELOG below.
  - Do not use localStorage/sessionStorage; nothing persists by design.
  - To add a new shape type: (1) add a tool button in the toolbar with
    data-tool="name", (2) add a case in drawShape(), (3) make sure bounds()
    returns its bounding box (used for select/move), (4) add a hint in HINTS,
    (5) optionally add a shortcut in the keyboard `map`.
  - Export renders the shape list to an offscreen canvas at 2x (renderExport),
    so the exported PNG is always 1920x1200 with a white background,
    regardless of the on-screen display size.
  - Clipboard copy requires a secure context (https or file://) and a
    browser that supports ClipboardItem. Firefox often refuses image writes;
    the code catches that and points the student to Download instead.
  - Fill is solid, in the shape's own color (a teacher request — don't make
    it translucent again).
  - The Clear button intentionally has NO confirm dialog (teacher request);
    undo restores a cleared drawing.
  - The canvas frame is sized with CSS (aspect-ratio + min()) so it never
    overflows the viewport; don't reintroduce scrolling.
  - The eraser removes WHOLE shapes (it's an object eraser, not a pixel
    eraser) because the drawing is a shape list, not a bitmap. It uses
    hitTest(), which measures distance to the actual stroke/outline.
  - Tested with Playwright/Chromium: download and clipboard both verified.

  CHANGELOG
  ---------
  1.4.0  Eraser tool (X): click or drag over a shape to remove it. Hit
         testing now checks distance to the actual stroke, not just the
         bounding box.
  1.3.0  Added comments, LLM notes, version number shown bottom-right.
  1.2.0  Canvas frame scales to fit the window (no scrolling); Clear no
         longer asks for confirmation.
  1.1.0  Fill shapes is now solid, same color as the outline.
  1.0.0  First version: pen, line, arrow, rect, ellipse, text, colors,
         width, undo/redo, select/move, copy image, download PNG.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sketchpad</title>
<style>
  /* ---- Design tokens: change colors here, they're reused everywhere ---- */
  :root {
    --paper: #ffffff;        /* canvas background */
    --desk: #e9ecef;         /* page background around the canvas */
    --ink: #1f2933;          /* default text/ui color */
    --chrome: #f7f8fa;       /* toolbar + status bar background */
    --line: #cfd4da;         /* borders */
    --accent: #2457c5;       /* selected tool, primary button, selection box */
    --accent-soft: #dce6fb;  /* selected tool background */
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }

  /* Page is a vertical flex column: toolbar / stage (grows) / status bar */
  body {
    font-family: "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif;
    font-size: 14px;
    color: var(--ink);
    background: var(--desk);
    display: flex;
    flex-direction: column;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible, select:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }

  /* ---- Toolbar ---- */
  .bar {
    background: var(--chrome);
    border-bottom: 1px solid var(--line);
    padding: 8px 12px;
    display: flex;
    flex-wrap: wrap;            /* wraps to a second row on narrow screens */
    gap: 6px 18px;
    align-items: center;
  }
  .group { display: flex; align-items: center; gap: 4px; }
  .group-label { color: #6b7280; margin-right: 4px; }

  /* Tool buttons (pen, arrow, etc). aria-pressed="true" = active tool */
  .tool {
    width: 36px; height: 36px;
    border: 1px solid transparent;
    border-radius: 6px;
    background: transparent;
    display: grid; place-items: center;
    padding: 0;
  }
  .tool:hover { background: #e9edf3; }
  .tool[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
  .tool svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* Color swatches (generated by JS from the PALETTE array) */
  .swatch {
    width: 22px; height: 22px; border-radius: 50%;
    border: 2px solid #fff; box-shadow: 0 0 0 1px var(--line);
    padding: 0;
  }
  .swatch[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--accent); }
  input[type="color"] {
    width: 30px; height: 26px; border: 1px solid var(--line); border-radius: 4px;
    background: #fff; padding: 2px; cursor: pointer;
  }
  input[type="range"] { width: 90px; }
  select {
    font: inherit; padding: 4px 6px; border: 1px solid var(--line); border-radius: 4px; background: #fff;
  }
  label.check { display: flex; align-items: center; gap: 4px; cursor: pointer; }

  /* Text buttons (Undo, Clear, Download...) */
  .btn {
    padding: 6px 12px; border-radius: 6px;
    border: 1px solid var(--line); background: #fff;
  }
  .btn:hover { background: #f0f2f5; }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { background: #1d4aa8; }
  .spacer { flex: 1; }   /* pushes the export buttons to the right */

  /* ---- Stage: the gray area holding the canvas ---- */
  .stage {
    flex: 1;
    min-height: 0;              /* lets the flex child shrink below content size */
    display: grid; place-items: center;
    padding: 12px;
    overflow: hidden;           /* never scroll; the frame is sized to fit instead */
  }

  /* The white "paper". Sized so it always fits both the width and height of
     the window while keeping the 960x600 (16:10) aspect ratio.
     150px ≈ toolbar + status bar + padding. */
  .frame {
    position: relative;         /* the floating text editor is positioned inside it */
    background: var(--paper);
    border: 1px solid var(--line);
    box-shadow: 0 1px 3px rgba(0,0,0,.15), 0 8px 24px rgba(0,0,0,.08);
    width: min(100%, calc((100dvh - 150px) * 1.6));
    max-width: 960px;
    aspect-ratio: 960 / 600;
  }
  /* The canvas element fills the frame; its internal size stays 960x600 */
  canvas { display: block; touch-action: none; width: 100%; height: 100%; }
  canvas.cursor-cross { cursor: crosshair; }
  canvas.cursor-text { cursor: text; }
  canvas.cursor-move { cursor: move; }
  canvas.cursor-default { cursor: default; }
  canvas.cursor-eraser { cursor: cell; }

  /* Floating box used while typing/editing text (see openTextEditor) */
  .text-editor {
    position: absolute;
    border: 1px dashed var(--accent);
    background: rgba(255,255,255,.9);
    padding: 2px 4px;
    font-family: inherit;
    min-width: 40px;
    outline: none;
    white-space: pre;
    line-height: 1.2;
  }

  /* ---- Status bar: hint on the left, message + version on the right ---- */
  .status {
    background: var(--chrome);
    border-top: 1px solid var(--line);
    padding: 6px 12px;
    color: #4b5563;
    display: flex; gap: 16px; flex-wrap: wrap; align-items: center;
    min-height: 30px;
  }
  .status .msg { color: var(--accent); }
  .status .msg.err { color: #b42318; }
  .status .version { color: #9aa3ad; font-size: 12px; }
  kbd { font-family: inherit; border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; background: #fff; }
</style>
</head>
<body>

<!-- ======================= TOOLBAR ======================= -->
<div class="bar" role="toolbar" aria-label="Drawing tools">

  <!-- Drawing tools. data-tool must match a case in drawShape() / HINTS -->
  <div class="group" id="tools">
    <button class="tool" data-tool="select" title="Select / move (V)" aria-pressed="false">
      <svg viewBox="0 0 24 24"><path d="M5 3l14 9-6 1-3 6z"/></svg></button>
    <button class="tool" data-tool="pen" title="Pen (P)" aria-pressed="true">
      <svg viewBox="0 0 24 24"><path d="M4 20l4-1 11-11-3-3L5 16z"/><path d="M13 7l3 3"/></svg></button>
    <button class="tool" data-tool="line" title="Line (L)" aria-pressed="false">
      <svg viewBox="0 0 24 24"><path d="M4 20L20 4"/></svg></button>
    <button class="tool" data-tool="arrow" title="Arrow (A)" aria-pressed="false">
      <svg viewBox="0 0 24 24"><path d="M4 20L20 4"/><path d="M11 4h9v9"/></svg></button>
    <button class="tool" data-tool="rect" title="Rectangle (R)" aria-pressed="false">
      <svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="1"/></svg></button>
    <button class="tool" data-tool="ellipse" title="Ellipse (E)" aria-pressed="false">
      <svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="8" ry="6.5"/></svg></button>
    <button class="tool" data-tool="text" title="Text (T)" aria-pressed="false">
      <svg viewBox="0 0 24 24"><path d="M5 6h14M12 6v13M9 19h6"/></svg></button>
    <button class="tool" data-tool="eraser" title="Eraser (X)" aria-pressed="false">
      <svg viewBox="0 0 24 24"><path d="M4 16l9-9 6 6-5 5H8z"/><path d="M11 20h9"/></svg></button>
  </div>

  <!-- Color: swatches are inserted here by JS, before the custom picker -->
  <div class="group" id="colors">
    <span class="group-label">Color</span>
    <input type="color" id="colorPicker" value="#1f2933" title="Custom color">
  </div>

  <div class="group">
    <span class="group-label">Width</span>
    <input type="range" id="width" min="1" max="16" value="3" title="Line width">
  </div>

  <div class="group">
    <span class="group-label">Text</span>
    <select id="fontSize" title="Text size">
      <option value="14">Small</option>
      <option value="20" selected>Medium</option>
      <option value="28">Large</option>
      <option value="40">Huge</option>
    </select>
  </div>

  <div class="group">
    <label class="check"><input type="checkbox" id="fill"> Fill shapes</label>
  </div>

  <div class="group">
    <button class="btn" id="undo" title="Undo (Ctrl+Z)">Undo</button>
    <button class="btn" id="redo" title="Redo (Ctrl+Y)">Redo</button>
    <button class="btn" id="delete" title="Delete selected (Delete)">Delete</button>
    <button class="btn" id="clear" title="Clear everything">Clear</button>
  </div>

  <span class="spacer"></span>

  <!-- Export -->
  <div class="group">
    <button class="btn" id="copy" title="Copy image to clipboard">Copy image</button>
    <button class="btn primary" id="download" title="Download as PNG">Download PNG</button>
  </div>
</div>

<!-- ======================= CANVAS ======================= -->
<div class="stage">
  <div class="frame" id="frame">
    <!-- width/height here are the INTERNAL drawing resolution, not display size -->
    <canvas id="c" width="960" height="600" aria-label="Drawing canvas"></canvas>
  </div>
</div>

<!-- ======================= STATUS BAR ======================= -->
<div class="status">
  <span id="hint"></span>
  <span class="spacer"></span>
  <span class="msg" id="msg"></span>
  <span class="version" id="version"></span>
</div>

<script>
(() => {
  // =========================================================================
  // a. CONSTANTS & STATE
  // =========================================================================

  // Bump this on every change (and the VERSION line in the header comment).
  const APP_VERSION = '1.4.0';
  document.getElementById('version').textContent = 'v' + APP_VERSION;

  const W = 960, H = 600;                        // internal canvas size (units)
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const frame = document.getElementById('frame');
  const msgEl = document.getElementById('msg');
  const hintEl = document.getElementById('hint');
  const FONT = '"Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif';

  // Quick-pick swatches shown in the toolbar (any hex color works)
  const PALETTE = ['#1f2933', '#d0342c', '#e8871e', '#e5b800', '#2e9e4f', '#2457c5', '#7b3fbf', '#9aa3ad', '#ffffff'];

  // Hint text shown in the status bar for each tool
  const HINTS = {
    select: 'Select: click a shape to select it, drag to move. Double-click text to edit.',
    pen: 'Pen: drag to draw freehand. Hold Shift for a straight line.',
    line: 'Line: drag from start to end. Hold Shift to snap to 45°.',
    arrow: 'Arrow: drag from the tail to the head. Hold Shift to snap to 45°.',
    rect: 'Rectangle: drag a corner. Hold Shift for a square.',
    ellipse: 'Ellipse: drag a corner. Hold Shift for a circle.',
    text: 'Text: click where the text should go, type, then press Enter.',
    eraser: 'Eraser: click or drag over a shape to remove it. Undo brings it back.'
  };

  // Current tool settings (what the NEXT shape will use)
  let tool = 'pen';
  let color = '#1f2933';
  let lineWidth = 3;
  let fontSize = 20;
  let fill = false;

  // The drawing itself + editing state
  let shapes = [];          // committed shapes, drawn in array order (last = on top)
  let history = [];         // undo stack: JSON snapshots of `shapes`
  let future = [];          // redo stack
  let draft = null;         // the shape currently being dragged out (not yet in `shapes`)
  let selectedId = null;    // id of the selected shape (select tool), or null
  let drag = null;          // while moving a selected shape: {x, y, orig, moved}
  let erasing = false;      // eraser button held down; true once something was committed
  let nextId = 1;           // id counter for new shapes

  // =========================================================================
  // b. UNDO / REDO
  //    Call commit() BEFORE changing `shapes`; it saves the current state.
  // =========================================================================
  const snapshot = () => JSON.stringify(shapes);

  function commit() {
    history.push(snapshot());
    if (history.length > 200) history.shift();   // cap memory use
    future = [];                                 // a new action clears redo
    updateButtons();
  }
  function undo() {
    if (!history.length) return;
    future.push(snapshot());
    shapes = JSON.parse(history.pop());
    selectedId = null; draw(); updateButtons();
  }
  function redo() {
    if (!future.length) return;
    history.push(snapshot());
    shapes = JSON.parse(future.pop());
    selectedId = null; draw(); updateButtons();
  }
  function updateButtons() {
    document.getElementById('undo').disabled = !history.length;
    document.getElementById('redo').disabled = !future.length;
    document.getElementById('delete').disabled = selectedId == null;
  }

  // Short message in the status bar that disappears after 3 seconds
  function say(text, isErr) {
    msgEl.textContent = text;
    msgEl.className = 'msg' + (isErr ? ' err' : '');
    clearTimeout(say.t);
    say.t = setTimeout(() => (msgEl.textContent = ''), 3000);
  }

  // Convert a mouse/touch event position into canvas units (0..W, 0..H).
  // Needed because the canvas is displayed scaled to fit the window.
  function pos(e) {
    const r = canvas.getBoundingClientRect();
    return {
      x: (e.clientX - r.left) * (W / r.width),
      y: (e.clientY - r.top) * (H / r.height)
    };
  }

  // =========================================================================
  // c. DRAWING
  //    drawShape() draws one shape onto any 2D context (screen or export).
  //    draw() clears the screen canvas and redraws everything.
  // =========================================================================
  function drawArrowHead(c, x1, y1, x2, y2, w) {
    const ang = Math.atan2(y2 - y1, x2 - x1);   // direction of the arrow
    const len = Math.max(10, w * 4);            // head size scales with line width
    c.beginPath();
    c.moveTo(x2, y2);
    c.lineTo(x2 - len * Math.cos(ang - Math.PI / 6), y2 - len * Math.sin(ang - Math.PI / 6));
    c.moveTo(x2, y2);
    c.lineTo(x2 - len * Math.cos(ang + Math.PI / 6), y2 - len * Math.sin(ang + Math.PI / 6));
    c.stroke();
  }

  function drawShape(c, s) {
    if (s.hidden) return;                 // text being edited is hidden on canvas
    c.strokeStyle = s.color;
    c.fillStyle = s.color;
    c.lineWidth = s.width;
    c.lineCap = 'round';
    c.lineJoin = 'round';
    switch (s.type) {
      case 'pen':
        if (s.points.length < 2) {        // a single click = a dot
          c.beginPath(); c.arc(s.points[0].x, s.points[0].y, s.width / 2, 0, Math.PI * 2); c.fill();
          break;
        }
        c.beginPath();
        c.moveTo(s.points[0].x, s.points[0].y);
        for (let i = 1; i < s.points.length; i++) c.lineTo(s.points[i].x, s.points[i].y);
        c.stroke();
        break;

      case 'line':
      case 'arrow':
        c.beginPath(); c.moveTo(s.x1, s.y1); c.lineTo(s.x2, s.y2); c.stroke();
        if (s.type === 'arrow') drawArrowHead(c, s.x1, s.y1, s.x2, s.y2, s.width);
        break;

      case 'rect': {
        // normalize so dragging in any direction works
        const x = Math.min(s.x1, s.x2), y = Math.min(s.y1, s.y2);
        const w = Math.abs(s.x2 - s.x1), h = Math.abs(s.y2 - s.y1);
        if (s.fill) c.fillRect(x, y, w, h);      // solid fill, same color
        c.strokeRect(x, y, w, h);
        break;
      }

      case 'ellipse': {
        const cx = (s.x1 + s.x2) / 2, cy = (s.y1 + s.y2) / 2;
        const rx = Math.abs(s.x2 - s.x1) / 2, ry = Math.abs(s.y2 - s.y1) / 2;
        c.beginPath(); c.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
        if (s.fill) c.fill();
        c.stroke();
        break;
      }

      case 'text': {
        c.font = `${s.size}px ${FONT}`;
        c.textBaseline = 'top';           // (x,y) is the top-left of the text
        const lines = s.text.split('\n');
        lines.forEach((ln, i) => c.fillText(ln, s.x, s.y + i * s.size * 1.2));
        break;
      }
    }
  }

  // Bounding box {x,y,w,h} of a shape — used for hit testing and the selection outline
  function bounds(s) {
    if (s.type === 'pen') {
      const xs = s.points.map(p => p.x), ys = s.points.map(p => p.y);
      return { x: Math.min(...xs), y: Math.min(...ys), w: Math.max(...xs) - Math.min(...xs), h: Math.max(...ys) - Math.min(...ys) };
    }
    if (s.type === 'text') {
      ctx.font = `${s.size}px ${FONT}`;
      const lines = s.text.split('\n');
      const w = Math.max(...lines.map(l => ctx.measureText(l).width));
      return { x: s.x, y: s.y, w, h: lines.length * s.size * 1.2 };
    }
    return { x: Math.min(s.x1, s.x2), y: Math.min(s.y1, s.y2), w: Math.abs(s.x2 - s.x1), h: Math.abs(s.y2 - s.y1) };
  }

  // Distance from point (px,py) to the line segment (x1,y1)-(x2,y2)
  function segDist(px, py, x1, y1, x2, y2) {
    const dx = x2 - x1, dy = y2 - y1;
    const len2 = dx * dx + dy * dy;
    const t = len2 ? Math.max(0, Math.min(1, ((px - x1) * dx + (py - y1) * dy) / len2)) : 0;
    return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
  }

  // Is (x,y) within `pad` of this shape's actual stroke (or inside its fill)?
  function shapeHit(s, x, y, pad) {
    const tol = pad + s.width / 2;
    switch (s.type) {
      case 'pen':
        if (s.points.length < 2) return Math.hypot(x - s.points[0].x, y - s.points[0].y) <= tol;
        for (let i = 1; i < s.points.length; i++) {
          if (segDist(x, y, s.points[i - 1].x, s.points[i - 1].y, s.points[i].x, s.points[i].y) <= tol) return true;
        }
        return false;
      case 'line':
      case 'arrow':
        return segDist(x, y, s.x1, s.y1, s.x2, s.y2) <= tol;
      case 'rect': {
        const b = bounds(s);
        const inside = x >= b.x - tol && x <= b.x + b.w + tol && y >= b.y - tol && y <= b.y + b.h + tol;
        if (!inside) return false;
        if (s.fill) return true;
        // near any of the four edges?
        const nearX = Math.abs(x - b.x) <= tol || Math.abs(x - (b.x + b.w)) <= tol;
        const nearY = Math.abs(y - b.y) <= tol || Math.abs(y - (b.y + b.h)) <= tol;
        return nearX || nearY;
      }
      case 'ellipse': {
        const b = bounds(s);
        const cx = b.x + b.w / 2, cy = b.y + b.h / 2, rx = b.w / 2, ry = b.h / 2;
        if (rx < 1 || ry < 1) return false;
        // normalized radius: 1 = on the outline
        const r = Math.hypot((x - cx) / rx, (y - cy) / ry);
        const band = tol / Math.min(rx, ry);
        return s.fill ? r <= 1 + band : Math.abs(r - 1) <= band;
      }
      case 'text': {
        const b = bounds(s);
        return x >= b.x - pad && x <= b.x + b.w + pad && y >= b.y - pad && y <= b.y + b.h + pad;
      }
    }
    return false;
  }

  // Which shape is under (x,y)? Checks topmost first.
  function hitTest(x, y, pad = 6) {
    for (let i = shapes.length - 1; i >= 0; i--) {
      if (shapeHit(shapes[i], x, y, pad)) return shapes[i];
    }
    return null;
  }

  // Eraser: remove whatever is under the pointer (whole shape). Called on
  // pointerdown and every pointermove while erasing. Commits once per stroke.
  function eraseAt(x, y) {
    const hit = hitTest(x, y, 8);
    if (!hit) return;
    if (!erasing) { commit(); erasing = true; }
    shapes = shapes.filter(s => s !== hit);
    draw();
  }

  // Full redraw of the on-screen canvas
  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, W, H);
    shapes.forEach(s => drawShape(ctx, s));
    if (draft) drawShape(ctx, draft);            // shape in progress, on top
    const sel = shapes.find(s => s.id === selectedId);
    if (sel) {                                   // dashed selection box
      const b = bounds(sel);
      ctx.save();
      ctx.strokeStyle = '#2457c5';
      ctx.lineWidth = 1;
      ctx.setLineDash([5, 4]);
      ctx.strokeRect(b.x - 6, b.y - 6, b.w + 12, b.h + 12);
      ctx.restore();
    }
  }

  // =========================================================================
  // d. TOOL / COLOR / OPTION CONTROLS
  //    If a shape is selected, changing a setting also applies it to that shape.
  // =========================================================================
  function setTool(t) {
    tool = t;
    document.querySelectorAll('.tool').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.tool === t)));
    hintEl.textContent = HINTS[t];
    canvas.className = t === 'select' ? 'cursor-default' : t === 'text' ? 'cursor-text' : t === 'eraser' ? 'cursor-eraser' : 'cursor-cross';
    if (t !== 'select') { selectedId = null; draw(); updateButtons(); }
  }
  document.querySelectorAll('.tool').forEach(b => b.addEventListener('click', () => setTool(b.dataset.tool)));

  // Build the swatch buttons from PALETTE
  const colorsGroup = document.getElementById('colors');
  const picker = document.getElementById('colorPicker');
  PALETTE.forEach(hex => {
    const b = document.createElement('button');
    b.className = 'swatch'; b.style.background = hex; b.title = hex;
    b.setAttribute('aria-pressed', String(hex === color));
    b.addEventListener('click', () => setColor(hex));
    colorsGroup.insertBefore(b, picker);
  });
  picker.addEventListener('input', () => setColor(picker.value));

  function setColor(hex) {
    color = hex; picker.value = hex;
    document.querySelectorAll('.swatch').forEach(s => s.setAttribute('aria-pressed', String(s.title === hex)));
    const sel = shapes.find(s => s.id === selectedId);
    if (sel) { commit(); sel.color = hex; draw(); }
  }

  document.getElementById('width').addEventListener('input', e => {
    lineWidth = +e.target.value;
    const sel = shapes.find(s => s.id === selectedId);
    if (sel && sel.type !== 'text') { sel.width = lineWidth; draw(); }
  });
  document.getElementById('fontSize').addEventListener('change', e => {
    fontSize = +e.target.value;
    const sel = shapes.find(s => s.id === selectedId);
    if (sel && sel.type === 'text') { commit(); sel.size = fontSize; draw(); }
  });
  document.getElementById('fill').addEventListener('change', e => {
    fill = e.target.checked;
    const sel = shapes.find(s => s.id === selectedId);
    if (sel && (sel.type === 'rect' || sel.type === 'ellipse')) { commit(); sel.fill = fill; draw(); }
  });

  document.getElementById('undo').addEventListener('click', undo);
  document.getElementById('redo').addEventListener('click', redo);
  document.getElementById('delete').addEventListener('click', deleteSelected);
  document.getElementById('clear').addEventListener('click', () => {
    if (!shapes.length) return;
    commit();                       // no confirm dialog on purpose; undo restores it
    shapes = []; selectedId = null; draw(); updateButtons();
  });

  function deleteSelected() {
    if (selectedId == null) return;
    commit();
    shapes = shapes.filter(s => s.id !== selectedId);
    selectedId = null; draw(); updateButtons();
  }

  // =========================================================================
  // e. POINTER INPUT (mouse, touch, stylus all come through pointer events)
  //    down  -> start a draft shape (or select/start dragging)
  //    move  -> update the draft's end point (or move the selection)
  //    up    -> commit the draft into `shapes`
  // =========================================================================

  // Shift helpers: snap a line to 45° increments / force a square
  function snap(x1, y1, x2, y2) {
    const dx = x2 - x1, dy = y2 - y1;
    const ang = Math.round(Math.atan2(dy, dx) / (Math.PI / 4)) * (Math.PI / 4);
    const len = Math.hypot(dx, dy);
    return { x: x1 + len * Math.cos(ang), y: y1 + len * Math.sin(ang) };
  }
  function square(x1, y1, x2, y2) {
    const d = Math.max(Math.abs(x2 - x1), Math.abs(y2 - y1));
    return { x: x1 + Math.sign(x2 - x1 || 1) * d, y: y1 + Math.sign(y2 - y1 || 1) * d };
  }

  canvas.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;             // left button / primary touch only
    if (editor) finishText();               // clicking away commits open text
    const p = pos(e);
    canvas.setPointerCapture(e.pointerId);  // keep receiving moves even off-canvas

    if (tool === 'select') {
      const hit = hitTest(p.x, p.y);
      selectedId = hit ? hit.id : null;
      if (hit) {
        // remember where the drag started and a copy of the original shape
        drag = { x: p.x, y: p.y, orig: JSON.parse(JSON.stringify(hit)), moved: false };
        canvas.className = 'cursor-move';
      }
      draw(); updateButtons();
      return;
    }
    if (tool === 'text') {
      openTextEditor(p.x, p.y, null);
      return;
    }
    if (tool === 'eraser') {
      erasing = false;              // fresh stroke; first hit will commit()
      eraseAt(p.x, p.y);
      drag = { eraser: true };      // reuse drag flag so pointermove routes here
      return;
    }
    if (tool === 'pen') {
      draft = { type: 'pen', color, width: lineWidth, points: [p] };
    } else {
      draft = { type: tool, color, width: lineWidth, fill, x1: p.x, y1: p.y, x2: p.x, y2: p.y };
    }
    draw();
  });

  canvas.addEventListener('pointermove', e => {
    const p = pos(e);

    // Eraser drag: keep removing anything the pointer passes over
    if (drag && drag.eraser) { eraseAt(p.x, p.y); return; }

    // Moving a selected shape: offset every coordinate from the saved original
    if (drag) {
      const sel = shapes.find(s => s.id === selectedId);
      if (!sel) return;
      const dx = p.x - drag.x, dy = p.y - drag.y;
      if (!drag.moved && (Math.abs(dx) > 1 || Math.abs(dy) > 1)) { drag.moved = true; commit(); }
      const o = drag.orig;
      if (sel.type === 'pen') sel.points = o.points.map(q => ({ x: q.x + dx, y: q.y + dy }));
      else if (sel.type === 'text') { sel.x = o.x + dx; sel.y = o.y + dy; }
      else { sel.x1 = o.x1 + dx; sel.y1 = o.y1 + dy; sel.x2 = o.x2 + dx; sel.y2 = o.y2 + dy; }
      draw();
      return;
    }

    // Extending the shape being drawn
    if (!draft) return;
    if (draft.type === 'pen') {
      let q = p;
      // Shift + pen = straight line from the first point
      if (e.shiftKey) q = snap(draft.points[0].x, draft.points[0].y, p.x, p.y), draft.points.length = 1;
      draft.points.push(q);
    } else {
      let q = p;
      if (e.shiftKey) {
        q = (draft.type === 'rect' || draft.type === 'ellipse')
          ? square(draft.x1, draft.y1, p.x, p.y)
          : snap(draft.x1, draft.y1, p.x, p.y);
      }
      draft.x2 = q.x; draft.y2 = q.y;
    }
    draw();
  });

  function endStroke() {
    if (drag && drag.eraser) { drag = null; erasing = false; updateButtons(); return; }
    if (drag) { drag = null; canvas.className = 'cursor-default'; return; }
    if (!draft) return;
    // ignore accidental tiny shapes (a click with no drag)
    const tooSmall = draft.type !== 'pen' && Math.hypot(draft.x2 - draft.x1, draft.y2 - draft.y1) < 3;
    if (!tooSmall) {
      commit();
      draft.id = nextId++;
      shapes.push(draft);
    }
    draft = null;
    draw();
  }
  canvas.addEventListener('pointerup', endStroke);
  canvas.addEventListener('pointercancel', endStroke);

  // Double-click a text shape with the select tool to edit it
  canvas.addEventListener('dblclick', e => {
    if (tool !== 'select') return;
    const p = pos(e);
    const hit = hitTest(p.x, p.y);
    if (hit && hit.type === 'text') openTextEditor(hit.x, hit.y, hit);
  });

  // =========================================================================
  // f. TEXT EDITING
  //    Canvas can't take typed input, so we float a contenteditable <div>
  //    over the canvas at the click position, then turn its contents into a
  //    text shape when the student presses Enter or clicks away.
  //    Enter = finish, Shift+Enter = new line, Esc = cancel.
  // =========================================================================
  let editor = null;          // the floating <div>, or null
  let editingShape = null;    // existing text shape being edited, or null for new

  function openTextEditor(x, y, existing) {
    finishText();
    const r = canvas.getBoundingClientRect();
    const scale = r.width / W;                  // canvas units -> screen pixels
    const size = existing ? existing.size : fontSize;
    editor = document.createElement('div');
    editor.className = 'text-editor';
    editor.contentEditable = 'true';
    editor.style.left = (x * scale) + 'px';
    editor.style.top = (y * scale) + 'px';
    editor.style.fontSize = (size * scale) + 'px';
    editor.style.color = existing ? existing.color : color;
    editor.textContent = existing ? existing.text : '';
    editingShape = existing;
    if (existing) { existing.hidden = true; draw(); }  // hide the canvas copy while editing
    frame.appendChild(editor);
    editor.focus();
    editor.addEventListener('keydown', ev => {
      if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); finishText(); }
      if (ev.key === 'Escape') { ev.preventDefault(); cancelText(); }
      ev.stopPropagation();   // don't trigger the global tool shortcuts while typing
    });
    editor.addEventListener('blur', () => setTimeout(finishText, 0));
    // stash the canvas-unit position on the element for finishText()
    editor.dataset.x = x; editor.dataset.y = y; editor.dataset.size = size;
  }

  function finishText() {
    if (!editor) return;
    const el = editor; editor = null;
    const text = el.innerText.replace(/\n$/, '');
    const x = +el.dataset.x, y = +el.dataset.y, size = +el.dataset.size;
    el.remove();
    if (editingShape) {
      const s = editingShape; editingShape = null;
      delete s.hidden;
      if (text.trim() && text !== s.text) { commit(); s.text = text; }
      else if (!text.trim()) { commit(); shapes = shapes.filter(q => q !== s); selectedId = null; }  // emptied = delete
    } else if (text.trim()) {
      commit();
      shapes.push({ id: nextId++, type: 'text', text, x, y, size, color });
    }
    draw(); updateButtons();
  }

  function cancelText() {
    if (!editor) return;
    const el = editor; editor = null;
    el.remove();
    if (editingShape) { delete editingShape.hidden; editingShape = null; }
    draw();
  }

  // =========================================================================
  // g. KEYBOARD SHORTCUTS
  // =========================================================================
  window.addEventListener('keydown', e => {
    if (editor) return;                                     // typing text
    const tag = document.activeElement && document.activeElement.tagName;
    if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;  // focus in a control
    const k = e.key.toLowerCase();
    if ((e.ctrlKey || e.metaKey) && k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
    if ((e.ctrlKey || e.metaKey) && k === 'y') { e.preventDefault(); redo(); return; }
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (k === 'delete' || k === 'backspace') { deleteSelected(); return; }
    if (k === 'escape') { selectedId = null; draw(); updateButtons(); return; }
    const map = { v: 'select', p: 'pen', l: 'line', a: 'arrow', r: 'rect', e: 'ellipse', t: 'text', x: 'eraser' };
    if (map[k]) setTool(map[k]);
  });

  // =========================================================================
  // h. EXPORT
  //    Renders the shapes onto a hidden canvas at 2x resolution (1920x1200)
  //    with a white background, then either downloads it or copies it.
  // =========================================================================
  function renderExport() {
    const scale = 2;
    const off = document.createElement('canvas');
    off.width = W * scale; off.height = H * scale;
    const c = off.getContext('2d');
    c.scale(scale, scale);
    c.fillStyle = '#fff'; c.fillRect(0, 0, W, H);
    shapes.forEach(s => drawShape(c, s));
    return off;
  }

  document.getElementById('download').addEventListener('click', () => {
    const a = document.createElement('a');
    a.download = 'drawing-' + new Date().toISOString().slice(0, 10) + '.png';
    a.href = renderExport().toDataURL('image/png');
    a.click();
    say('Downloaded');
  });

  document.getElementById('copy').addEventListener('click', async () => {
    try {
      if (!navigator.clipboard || !window.ClipboardItem) throw new Error('unsupported');
      const blob = await new Promise(res => renderExport().toBlob(res, 'image/png'));
      await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
      say('Copied — paste it into your document');
    } catch (err) {
      // Firefox (and some locked-down browsers) block image clipboard writes
      say('Copy isn\'t supported in this browser. Use Download PNG instead.', true);
    }
  });

  // =========================================================================
  // i. STARTUP
  // =========================================================================
  setTool('pen');
  draw();
  updateButtons();
  // Warn before closing the tab if there's unsaved work (nothing is saved otherwise)
  window.addEventListener('beforeunload', e => { if (shapes.length) { e.preventDefault(); e.returnValue = ''; } });
})();
</script>
</body>
</html>
